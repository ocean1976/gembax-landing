<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="ttl">GembaX — Ücretsiz Ön Tarama</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500..900&family=Inter:wght@300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6; --bg2: #FFFFFF; --card: #F4F2EE; --navy: #1B2A4A; --text2: #4A5568; --muted: #8fa093;
    --green: #2D5016; --green-dark: #1e3f0f; --red: #FF1525; --border: rgba(0,0,0,0.08);
    --head: 'Inter Tight', sans-serif; --body: 'Inter', sans-serif; --mono: 'Space Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--body); color: var(--navy); background-color: var(--bg);
    background-image: linear-gradient(rgba(45,80,22,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(45,80,22,0.06) 1px, transparent 1px);
    background-size: 28px 28px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2.5rem; background: rgba(250,249,246,0.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--mono); font-weight: 700; font-size: 1.1rem; color: var(--navy); text-decoration: none; }
  .logo span { color: var(--green); }
  .nav-meta { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--text2); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 7.5rem 1.5rem 4rem; }
  .progress { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.2rem; }
  .progress .bar { flex: 1; height: 3px; background: rgba(27,42,74,0.1); border-radius: 2px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--red); width: 0; transition: width .35s ease; }
  .progress .n { font-family: var(--mono); font-size: 0.75rem; color: var(--text2); min-width: 4ch; text-align: right; }
  .layer { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin-bottom: 0.8rem; }
  h1 { font-family: var(--head); font-weight: 800; font-size: clamp(1.5rem, 3vw, 2.2rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.7rem; }
  .hint { color: var(--text2); font-size: 1rem; margin-bottom: 1.8rem; }
  .opts { display: grid; gap: 0.6rem; }
  .opt { text-align: left; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px; padding: 1rem 1.15rem; font-family: var(--body); font-size: 1rem; color: var(--navy); cursor: pointer; display: flex; align-items: center; gap: 0.9rem; transition: border-color .15s, transform .15s; }
  .opt:hover { border-color: var(--navy); transform: translateX(3px); }
  .opt.sel { border-color: var(--green); background: rgba(45,80,22,0.05); }
  .opt .k { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); min-width: 1.4rem; }
  .opt.multi::before { content: ''; width: 16px; height: 16px; border: 1.5px solid var(--navy); border-radius: 4px; flex: none; }
  .opt.multi.sel::before { background: var(--green); border-color: var(--green); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.6rem; }
  .btn-back { background: none; border: none; font-family: var(--body); color: var(--text2); cursor: pointer; font-size: 0.95rem; }
  .btn-next { background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 0.85rem 1.5rem; font-family: var(--body); font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .btn-next[disabled] { opacity: 0.35; cursor: default; }
  .kbd { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 1.2rem; }

  /* intro */
  .intro h1 { font-size: clamp(2rem, 4vw, 3rem); }
  .intro h1 em { font-style: normal; color: var(--red); }
  .intro .facts { display: flex; gap: 1.2rem; flex-wrap: wrap; margin: 1.4rem 0 2rem; }
  .intro .facts span { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; padding: 0.45rem 0.8rem; border: 1px solid var(--border); border-radius: 100px; background: var(--bg2); }
  .btn-start { background: #4ade80; color: #1A1916; text-decoration: none; padding: 1rem 1.8rem; border-radius: 10px; font-weight: 700; display: inline-block; border: none; font-family: var(--body); font-size: 1rem; cursor: pointer; box-shadow: 0 8px 22px rgba(74,222,128,0.28); }
  .btn-start.go { background: #FF1525; box-shadow: 0 8px 22px rgba(255,21,37,0.28); }
  .fine { color: var(--text2); font-size: 0.9rem; margin-top: 1rem; max-width: 56ch; }

  /* result */
  .res-label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--red); margin-bottom: 0.6rem; }
  .res h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
  .res .why { font-size: 1.08rem; color: var(--navy); margin: 1rem 0 1.6rem; max-width: 62ch; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem 1.5rem; margin-bottom: 1rem; }
  .card h3 { font-family: var(--head); font-size: 1.05rem; font-weight: 700; margin-bottom: 0.7rem; }
  .card ul { list-style: none; }
  .card li { position: relative; padding-left: 1.4rem; color: var(--text2); margin-bottom: 0.45rem; }
  .card li::before { content: '→'; position: absolute; left: 0; color: var(--red); }
  .card.warn { border-left: 3px solid var(--red); }
  .card.warn p { color: var(--navy); }
  .tier { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; border: 1.5px solid var(--green); }
  .tier .name { font-family: var(--head); font-weight: 800; font-size: 1.25rem; }
  .tier .rec { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; color: var(--green-dark); margin-bottom: 0.3rem; }
  .tier .recnote { grid-column: 1 / -1; font-size: 0.85rem; color: var(--text2); border-top: 1px solid var(--border); padding-top: 0.7rem; margin-top: 0.2rem; }
  .tier .scope { color: var(--text2); font-size: 0.95rem; margin-top: 0.2rem; }
  .tier .price { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--green-dark); text-align: right; }
  .tier .price small { display: block; font-size: 0.68rem; font-weight: 400; color: var(--text2); letter-spacing: 0.06em; }
  .honest { font-family: var(--mono); font-size: 0.74rem; color: var(--text2); border-top: 1px solid var(--border); padding-top: 0.9rem; margin: 1.2rem 0 1.6rem; line-height: 1.6; }
  .ctas { display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .btn-ghost { color: var(--green-dark); text-decoration: none; padding: 0.95rem 1.4rem; border-radius: 10px; font-weight: 600; border: 1.5px solid rgba(45,80,22,0.3); background: transparent; font-family: var(--body); font-size: 0.95rem; cursor: pointer; }
  .email { margin-top: 1.4rem; display: none; }
  .email.on { display: block; }
  .email input { width: 100%; padding: 0.9rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: var(--body); font-size: 1rem; margin-bottom: 0.6rem; background: var(--bg2); }
  .quota { font-family: var(--mono); font-size: 0.72rem; color: var(--text2); margin-top: 0.5rem; }
  .thanks { display: none; padding: 1rem 1.2rem; background: rgba(45,80,22,0.06); border-radius: 10px; color: var(--green-dark); font-weight: 500; }
  .hidden { display: none; }
  .fade { animation: fade .3s ease; }
  /* soru kartı geçişleri */
  #q { transition: opacity .26s ease, transform .26s ease; will-change: opacity, transform; }
  #q.out-fwd { opacity: 0; transform: translateX(-22px); }
  #q.out-back { opacity: 0; transform: translateX(22px); }
  #q.pre-fwd { opacity: 0; transform: translateX(22px); transition: none; }
  #q.pre-back { opacity: 0; transform: translateX(-22px); transition: none; }
  /* seçenekler */
  .opt { min-height: 54px; position: relative; padding-right: 2.8rem; transition: border-color .15s, background .15s, transform .12s; user-select: none; -webkit-tap-highlight-color: transparent; }
  .opt:active { transform: scale(0.99); }
  .opt .chk { position: absolute; right: 1rem; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--green); color: #fff; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.6); transition: opacity .18s, transform .18s; }
  .opt.sel .chk { opacity: 1; transform: scale(1); }
  .opt.sel { border-color: var(--green); background: rgba(45,80,22,0.06); }
  .opt.multi::before { content: ''; width: 16px; height: 16px; border: 1.5px solid var(--navy); border-radius: 4px; flex: none; transition: background .15s, border-color .15s; }
  .opt.multi.sel::before { background: var(--green); border-color: var(--green); }
  .opt.multi .chk { display: none; }
  .hint:empty { display: none; }
  .row.single .btn-next { display: none; }
  .autonote { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
  .kbd { display: none; }
  @media (hover: hover) { .kbd { display: block; } .opt:hover { border-color: var(--navy); transform: translateX(3px); } }
  .progress .bar i { transition: width .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 600px) { nav { padding: 1rem 1.2rem; } .wrap { padding: 6rem 1.1rem 3rem; } .tier { grid-template-columns: 1fr; } .tier .price { text-align: left; } }


  /* ===== seçenek biçimleri ===== */
  .opts.grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.7rem; }
  .opt.tile { flex-direction: column; align-items: flex-start; gap: 0.55rem; min-height: 96px; padding: 1rem 1rem 0.9rem; padding-right: 1rem; }
  .opt.tile .ico { width: 26px; height: 26px; color: var(--navy); opacity: 0.8; }
  .opt.tile .ico svg { width: 100%; height: 100%; }
  .opt.tile.sel .ico { color: var(--green); opacity: 1; }
  .opt.tile .k { display: none; }
  .opt.tile .chk { right: 0.7rem; top: 0.7rem; margin-top: 0; }
  .opts.scale { display: flex; gap: 0.45rem; flex-wrap: wrap; }
  .opts.scale .opt { flex: 1 1 0; min-width: 84px; justify-content: center; text-align: center; padding: 1rem 0.5rem; min-height: 62px; font-weight: 600; padding-right: 0.5rem; }
  .opts.scale .opt .k { display: none; }
  .opts.scale .opt .chk { position: static; margin: 0 0 0 0.35rem; width: 16px; height: 16px; font-size: 0.6rem; }
  .opts.scale .opt.dk { flex: 1 1 100%; font-weight: 400; color: var(--text2); background: transparent; border-style: dashed; min-height: 48px; }
  .scale-hint { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.66rem; color: var(--muted); margin: 0.35rem 0.2rem 0; letter-spacing: 0.06em; }
  /* profil ekranı */
  .pgroup { margin-bottom: 1.6rem; }
  .pgroup .pl { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); margin-bottom: 0.6rem; display: flex; gap: 0.5rem; align-items: center; }
  .pgroup .pl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .pgroup.done .pl .dot { background: var(--green); }
  .pgroup .opts.grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .pgroup .opt.tile { min-height: 82px; }
  @media (max-width: 600px) { .opts.grid, .pgroup .opts.grid { grid-template-columns: 1fr 1fr; } .opt.tile { min-height: 80px; } }

  /* ===== sonuç sayfası ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.4rem 0 1.2rem; }
  .chips span { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.05em; padding: 0.35rem 0.65rem; border: 1px solid var(--border); border-radius: 100px; background: var(--bg2); color: var(--text2); }
  .bars { display: grid; gap: 0.55rem; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 0.7rem; align-items: center; font-size: 0.85rem; }
  .bar-row .bl { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; color: var(--text2); }
  .bar-row .bt { height: 8px; background: rgba(27,42,74,0.08); border-radius: 4px; overflow: hidden; }
  .bar-row .bt i { display: block; height: 100%; background: var(--navy); border-radius: 4px; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .bar-row.lead .bt i { background: var(--red); }
  .bar-row .bv { font-family: var(--mono); font-size: 0.7rem; color: var(--text2); text-align: right; }
  .sig-tag { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; padding: 0.15rem 0.4rem; border-radius: 3px; background: rgba(27,42,74,0.08); color: var(--navy); margin-left: 0.5rem; vertical-align: middle; }
  .card.read { border-left: 3px solid var(--navy); }
  .card.read p { color: var(--navy); font-size: 1.02rem; line-height: 1.65; }
  .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
  .steps3 div { background: var(--card); border-radius: 10px; padding: 0.9rem 1rem; font-size: 0.9rem; color: var(--text2); }
  .steps3 b { display: block; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; color: var(--red); margin-bottom: 0.35rem; }
  .btn-print { background: transparent; border: 1.5px solid var(--border); color: var(--text2); padding: 0.95rem 1.2rem; border-radius: 10px; font-family: var(--body); font-size: 0.95rem; cursor: pointer; }
  @media (max-width: 600px) { .steps3 { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 96px 1fr 40px; } }
  @media print { nav, .ctas, .email, .lang, .btn-print { display: none !important; } body { background: #fff; } .wrap { padding-top: 1rem; } }
  .consent { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.88rem; color: var(--text2); margin: 0.6rem 0 0.9rem; line-height: 1.45; }
  .consent input { margin-top: 0.25rem; width: 16px; height: 16px; flex: none; accent-color: var(--green); }
  .consent a { color: var(--green-dark); }
  .privacy { font-family: var(--mono); font-size: 0.72rem; color: var(--text2); border-top: 1px solid var(--border); padding-top: 0.8rem; margin-top: 1.2rem; line-height: 1.6; max-width: 62ch; }
  .lang { display: flex; gap: 0.3rem; }
  .lang button { font-family: var(--mono); font-size: 0.72rem; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem; cursor: pointer; color: var(--text2); }
  .lang button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html" id="logoLink">Gemba<span>X</span></a>
  <div style="display:flex;gap:1.2rem;align-items:center">
    <div class="nav-meta" id="navMeta"></div>
    <div class="lang" id="langSel"><button data-l="tr">TR</button><button data-l="en">EN</button><button data-l="es">ES</button></div>
  </div>
</nav>

<div class="wrap">
  <div id="intro" class="intro fade">
    <div class="layer" id="iLayer"></div>
    <h1 id="iTitle"></h1>
    <p class="hint" id="iHint"></p>
    <div class="facts" id="iFacts"></div>
    <button class="btn-start" onclick="start()" id="iBtn"></button>
    <p class="fine" id="iFine"></p>
    <p class="privacy" id="iPriv"></p>
  </div>

  <div id="q" class="hidden">
    <div class="progress"><div class="bar"><i id="bar"></i></div><div class="n" id="num">1/10</div></div>
    <div class="layer" id="layer"></div>
    <h1 id="qt"></h1>
    <p class="hint" id="qh"></p>
    <div class="opts" id="opts"></div>
    <div class="row" id="row">
      <button class="btn-back" id="back" onclick="back()"></button>
      <span class="autonote" id="autonote"></span>
      <button class="btn-next" id="next" onclick="next()" disabled></button>
    </div>
    <div class="kbd" id="kbd"></div>
  </div>

  <div id="res" class="res hidden"></div>
</div>

<script>
var Q = {
  sector:  { t: 'Hangi sektördesiniz?', h: 'Soruların dili ve içeriği buna göre değişir.', opts: [['Üretim'],['Lojistik / Depo'],['Distribütörlük / Toptan'],['E-ticaret'],['Perakende'],['Hizmet / Ajans'],['İnşaat / Taahhüt'],['Restoran / Konaklama'],['Sağlık / Klinik'],['SaaS / Dijital'],['Diğer']] },
  size:    { t: 'Kaç çalışanınız var?', h: '', opts: [['1–10'],['11–50'],['51–250'],['250+']] },
  revenue: { t: 'Yıllık cironuz hangi bantta?', h: 'Garantimiz ($15.000 yıllık kaçak) her ölçekte anlamlı değil; dürüst yönlendirme için soruyoruz.', opts: [['$500K altı'],['$500K – $2M'],['$2M – $10M'],['$10M üstü']] },
  tried:   { t: 'Bu konuda daha önce ne denediniz?', h: '', opts: [['Hiçbir şey',{},'daha önce müdahale edilmemiş'],['İç ekiple çalıştık',{},'iç ekip denemesi sonuç vermemiş'],['Danışman aldık',{},'danışman denemesi sonuç vermemiş'],['Yazılım / ERP kurduk',{},'yazılım kurulmuş, sorun kalmış']] },

  /* ============ ÜRETİM ============ */
  m_pain: { t: 'Üretimde şu an en çok hangisi canınızı yakıyor?', h: 'İçinize en çok oturanı seçin.', opts: [
    ['Teslimat tarihlerini tutturamıyoruz', {b:2}, 'teslimat tarihleri tutmuyor', 'm_b1'],
    ['Fire, hurda, yeniden işleme yüksek', {w:2,r:1}, 'fire / yeniden işleme yüksek', 'm_q1'],
    ['Yarı mamul ve stok her yerde yığılıyor', {w:2,b:1}, 'yarı mamul ve stok yığılması', 'm_i1'],
    ['Fazla mesai olmadan iş çıkmıyor', {w:2,b:1}, 'fazla mesai kalıcı', 'm_o1'],
    ['Aynı arıza, aynı sorun tekrar tekrar', {r:3}, 'tekrarlayan arıza / sorun', 'm_r1'],
    ['Emin değilim, genel kontrol', {}, '', 'm_g1'] ] },
  m_b1: { t: 'İş en çok nerede bekliyor?', h: '', opts: [
    ['Belirli bir makine ya da istasyonda', {b:3}, 'iş belirli istasyonda yığılıyor', 'm_b2a'],
    ['Ürün değişimlerinde (setup)', {b:2,w:1}, 'ürün değişim süreleri akışı tıkıyor', 'm_b2b'],
    ['Malzeme gelmesini beklerken', {b:2,w:1}, 'malzeme beklemesi', 'm_i2'],
    ['Kalite kontrol ya da onay adımında', {b:3}, 'iş onay adımında bekliyor', 'm_b2c'],
    ['Bilmiyoruz, her yerde', {b:2}, 'yığılma noktası bilinmiyor', 'm_b2d'] ] },
  m_b2a: { t: 'O istasyon vardiya boyunca ne kadar boş duruyor?', h: 'Kısıt olan istasyon nadiren boş kalır.', opts: [
    ['Hiç; sürekli dolu, önünde iş bekliyor', {b:3}, 'darboğaz istasyonu hiç boş kalmıyor'],
    ['Ara ara boş kalıyor', {b:1,w:1}, 'darboğaz sanılan istasyon ara ara boş kalıyor'],
    ['Bilmiyoruz, ölçmüyoruz', {b:2}, 'istasyon doluluğu ölçülmüyor'] ] },
  m_b2b: { t: 'Bir ürün değişimi ortalama ne kadar sürüyor?', h: '', opts: [
    ['15 dakikadan az', {}, ''], ['15–60 dakika', {b:2}, 'ürün değişimi 15–60 dk'], ['1 saatten fazla', {b:3,w:1}, 'ürün değişimi 1 saatten uzun'], ['Bilmiyoruz', {b:2}, 'ürün değişim süresi ölçülmüyor'] ] },
  m_b2c: { t: 'Bir iş emri ya da kalite onayı kaç kişiden geçiyor?', h: '', opts: [
    ['Tek kişi', {}, ''], ['2–3 kişi', {b:2}, 'onay 2–3 kişiden geçiyor'], ['4 ya da daha fazla', {b:3,r:1}, 'onay 4+ kişiden geçiyor'], ['Belli değil, duruma göre', {b:2,r:2}, 'onay süreci tanımlı değil'] ] },
  m_b2d: { t: 'Zamanında teslimat oranınızı biliyor musunuz?', h: '', opts: [
    ['Evet, düzenli ölçüyoruz', {}, ''], ['Tahmini biliyoruz', {b:1}, 'zamanında teslimat tahmini'], ['Hayır', {b:2,w:1}, 'zamanında teslimat ölçülmüyor'] ] },
  m_q1: { t: 'Hata en çok nerede ortaya çıkıyor?', h: '', opts: [
    ['Üretim sırasında (hurda)', {w:2}, 'üretim içi hurda', 'm_q2a'],
    ['Son kontrolde', {w:2,r:1}, 'hata son kontrolde yakalanıyor', 'm_q2b'],

  en: {
    m: { w: 'In a plant, waste hides in three places: overtime that became routine, inventory called "safety stock", and rework nobody counts. The X-ray converts each into dollars by station; the biggest line is usually the one you can\'t see, not the one you suspect.',
         b: 'The bottleneck in a plant is rarely the most expensive machine; it\'s usually the station with the longest queue in front of it, or an approval step. Every machine bought before finding it only moves the queue.',
         r: 'The same breakdown, defect or delay may look different, but in a plant it usually traces to one root: an undefined standard, an unmeasured parameter or a missing handover. Until the root is found, every fix is temporary.' },
    l: { w: 'In a warehouse, waste lives in half-empty trucks, pallets touched twice and dead stock taking up space. The X-ray converts these into cost per order; fill rate alone can be worth a truck a year.',
         b: 'In logistics the bottleneck is usually not the dock but the paperwork and approvals before it. Every truck and rack added before finding the queue only adds waiting trucks.',
         r: 'The delay and error that recur every week show up under different names in different shifts; the root is usually one undefined process. Changing staff or vehicles won\'t change the outcome until it\'s found.' },
    d: { w: 'In distribution, waste has two big addresses: stock that doesn\'t sell and collections that come late. Both eat cash, not just profit; the X-ray shows which products and customers tie up how much.',
         b: 'In distribution the bottleneck hides in the days between order and shipment, usually picking or the approval-invoicing step. Warehouse and fleet added before finding it turn waiting orders into waiting trucks.',
         r: 'The same customer problem appears as late delivery, wrong item and invoice error in three places; it usually has one root: an undefined order-approval process. Customer loss continues until it\'s found.' },
    e: { w: 'In e-commerce, waste lives in returns, wrong shipments and unprofitable ads. Every campaign run without knowing profit per order can grow revenue while melting profit; the X-ray shows which orders lose money, per product.',
         b: 'In e-commerce the bottleneck is usually the packing table or the carrier cutoff. Warehouse and staff added before finding it produce the same queue at the same hour.',
         r: 'Recurring returns and complaints look different across products but usually share one root: the product page, the stock decision or the response process. Until it\'s found, every campaign buys the same return again.' },
    c: { w: 'In construction, waste accumulates in rework, unpriced changes and waiting progress payments. Without per-project accounting, profit only appears when the job is done; the X-ray converts it into dollars while the job is running.',

         b: 'The service bottleneck is usually the kitchen pass or the seating moment; adding staff adds waiting staff, not throughput. First find which minute jams what.',
         r: 'The same complaint in reviews looks different across shifts; its root is usually an undefined standard or training process. Changing staff won\'t change the complaint until it\'s found.' },

  es: {
    m: { w: 'En planta, el desperdicio se esconde en tres lugares: horas extra convertidas en rutina, inventario llamado "de seguridad" y retrabajo que nadie cuenta. La radiografía convierte cada uno en dólares por estación; la mayor partida suele ser la que no se ve, no la que se sospecha.',

         r: 'El mismo problema de cliente aparece como entrega tardía, artículo equivocado y error de factura en tres lugares; suele tener una raíz: un proceso de aprobación de pedidos no definido. La pérdida de clientes sigue hasta encontrarla.' },
    e: { w: 'En e-commerce, el desperdicio vive en devoluciones, envíos equivocados y publicidad sin ganancia. Cada campaña hecha sin conocer la ganancia por pedido puede subir ingresos y derretir la ganancia; la radiografía muestra qué pedidos pierden dinero, por producto.',

    c: { w: 'En construcción, el desperdicio se acumula en retrabajo, cambios no valorados y certificaciones en espera. Sin contabilidad por proyecto la ganancia solo aparece al terminar; la radiografía la convierte en dólares con la obra en marcha.',

         r: 'El problema que se repite en cada proyecto parece distinto en cada obra pero tiene una raíz: información de proyecto incompleta, planificación verbal o un proceso de cambios no definido. El siguiente proyecto repite la desviación hasta encontrarla.' },
    k: { w: 'En un restaurante, el desperdicio se esconde en el coste de alimentos, el exceso de preparación y las porciones inconsistentes; sin rentabilidad por plato, los ingresos crecen y la ganancia no. La radiografía muestra qué plato pierde dinero.',
         b: 'El cuello de botella del servicio suele ser la salida de cocina o el momento de sentar; añadir personal añade personal en espera, no capacidad. Primero hay que encontrar qué minuto atasca qué.',
         r: 'La misma queja en las reseñas parece distinta entre turnos; su raíz suele ser un estándar o un proceso de formación no definido. Cambiar personal no cambia la queja hasta encontrarla.' },
    t: { w: 'En una clínica, el desperdicio se acumula en descartes por caducidad, inasistencias y facturas rechazadas. La radiografía convierte cada uno en dólares anuales; la mayor partida suele ser la cita vacía.',
         b: 'En una clínica el cuello de botella no es el médico, sino los pasos antes y después: registro, resultados, alta. Médicos añadidos antes de encontrarlo agrandan la sala de espera.',

    h: { w: 'En un negocio de servicios, el desperdicio vive en horas no facturables y trabajo fuera de alcance; sin rentabilidad por proyecto no se ve qué cliente pierde dinero. La radiografía lo muestra por hora.',
         b: 'En servicios el cuello de botella suele ser una persona o la aprobación del cliente. Una contratación hecha antes de encontrarlo no cambia la cola delante de esa persona o esa aprobación.',

    p: { w: 'En retail, el desperdicio se esconde en el más vendido que se agota, el stock que no se vende y las diferencias de inventario. Sin margen por producto no se ve qué estante pierde dinero; la radiografía lo muestra por tienda y producto.',
         b: 'En tienda el cuello de botella es la caja y el piso en hora punta; los turnos no planificados con datos por hora producen exceso de personal fuera de punta y falta en punta. Primero hay que encontrar qué hora atasca qué.',

    s: { w: 'En SaaS, el desperdicio vive en el coste de soporte, el onboarding largo y el churn temprano; sin coste de soporte por cliente no se ve qué segmento pierde dinero. La radiografía lo muestra.',

    html += '<div class="ctas"><a class="btn-start go" href="/intake-welcome?tier=' + code + '&lang=' + lang + (psEnc ? '&ps=' + psEnc : '') + '">' + u.go + '</a><button class="btn-ghost" id="emBtn">' + (HUMAN_NOTE ? u.noteBtn : u.mailBtn) + '</button><button class="btn-print" onclick="window.print()">' + D.print + '</button></div>';
    html += '<div class="email" id="em"><p class="hint" style="margin-bottom:0.6rem">' + (HUMAN_NOTE ? u.noteHint : u.mailHint) + '</p>'
          + '<input type="email" id="emAddr" placeholder="' + u.email + '"><input type="text" placeholder="' + u.company + '">'
          + '<label class="consent"><input type="checkbox" id="consent"><span>' + u.consent + '</span></label>'
          + '<button class="btn-next" id="sendBtn" disabled>' + u.send + '</button>'
          + (HUMAN_NOTE ? '<div class="quota">' + u.quota + '</div>' : '') + '<div class="thanks" id="thx">' + (HUMAN_NOTE ? u.thanks : u.thanksMail) + '</div></div>';
  }
  var qb = document.getElementById('q'); qb.classList.add('out-fwd');
  setTimeout(function(){
    qb.classList.add('hidden'); qb.classList.remove('out-fwd');
    var r = document.getElementById('res'); r.innerHTML = html; r.classList.remove('hidden'); r.classList.add('fade');
    setTimeout(function(){ document.querySelectorAll('.bar-row .bt i').forEach(function(i){ i.style.width = i.dataset.w + '%'; }); }, 60);
    var eb = document.getElementById('emBtn'); if (eb) eb.addEventListener('click', function(){ document.getElementById('em').classList.add('on'); eb.style.display = 'none'; });
    var c = document.getElementById('consent'), sb = document.getElementById('sendBtn'), ea = document.getElementById('emAddr');
    function chk(){ if (sb) sb.disabled = !(c && c.checked && ea && /.+@.+\..+/.test(ea.value)); }
    if (c) c.addEventListener('change', chk); if (ea) ea.addEventListener('input', chk);
    if (sb) sb.addEventListener('click', function(){ document.getElementById('thx').style.display = 'block'; sb.disabled = true; });
    window.scrollTo({ top: 0, behavior: 'smooth' }); lock = false;
  }, 240);
}
function cap(s){ return s.charAt(0).toLocaleUpperCase(lang) + s.slice(1); }

setLang(detectLang());
</script>
