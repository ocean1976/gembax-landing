<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GembaX · Ücretsiz Ön Tarama</title>
<meta name="description" content="14 soruluk ücretsiz operasyonel ön tarama. İsraf, darboğaz ve kök neden sinyallerinizi görün.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --bg2:#FFFFFF; --card:#F4F2EE; --navy:#1B2A4A; --text2:#4A5568; --muted:#8fa093;
  --green:#2D5016; --green-dark:#1e3f0f; --green-soft:#EAF2E4; --red:#FF1525;
  --border:rgba(0,0,0,0.08); --border2:rgba(27,42,74,0.14);
  --head:'Inter Tight',sans-serif; --body:'Inter',sans-serif; --mono:'Space Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--body);color:var(--navy);background-color:var(--bg);
  background-image:linear-gradient(rgba(45,80,22,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(45,80,22,0.06) 1px,transparent 1px);
  background-size:28px 28px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:20;background:rgba(250,249,246,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);}
.hd{max-width:760px;margin:0 auto;padding:0.7rem 1.2rem;display:flex;align-items:center;gap:0.8rem;}
.avatar{width:40px;height:40px;border-radius:12px;background:#4ade80;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:0.9rem;color:#1A1916;flex:none;box-shadow:0 4px 14px rgba(74,222,128,0.3);}
.hname{font-family:var(--head);font-weight:700;font-size:1rem;line-height:1.2;}
.hstat{font-family:var(--mono);font-size:0.66rem;color:var(--text2);display:flex;align-items:center;gap:0.35rem;}
.dot{width:7px;height:7px;border-radius:50%;background:#3fa34d;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hprog{margin-left:auto;text-align:right;}
.hnum{font-family:var(--mono);font-size:0.72rem;color:var(--text2);}
.hbar{width:96px;height:4px;background:rgba(27,42,74,0.1);border-radius:2px;margin-top:5px;overflow:hidden;}
.hbar i{display:block;height:100%;width:0;background:var(--red);border-radius:2px;transition:width .4s ease;}

/* ── CHAT ── */
#chat{max-width:760px;margin:0 auto;padding:1.4rem 1.2rem 5rem;display:flex;flex-direction:column;gap:0.65rem;}
.msg{max-width:88%;padding:0.85rem 1.1rem;border-radius:16px;font-size:1rem;line-height:1.6;
  animation:pop .28s ease both;word-wrap:break-word;}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg,.optblock,.card,.chips,.sysline{scroll-margin-top:76px;}
.bot{align-self:flex-start;background:var(--bg2);border:1px solid var(--border2);border-bottom-left-radius:5px;
  box-shadow:0 1px 3px rgba(27,42,74,0.05);}
.bot.small{font-size:0.86rem;color:var(--text2);padding:0.5rem 0.9rem;box-shadow:none;background:var(--card);}
.bot .hint{display:block;margin-top:0.4rem;font-size:0.84rem;color:var(--text2);font-weight:400;}
.bot.q{background:#EEF1F7;border-left:3px solid var(--navy);font-weight:600;font-size:1.05rem;transition:background .4s,border-color .4s;}
.bot.q.active{background:#FBEDEB;border-left-color:var(--red);}
.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px;font-weight:500;}
.sysline{align-self:center;font-family:var(--mono);font-size:0.68rem;color:var(--red);letter-spacing:0.1em;padding:0.4rem 0;text-transform:uppercase;}

/* typing */
.typing{align-self:flex-start;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;border-bottom-left-radius:5px;
  padding:0.9rem 1.1rem;display:flex;gap:5px;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1.1s infinite;}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ── INLINE OPTIONS (sohbet akışının içinde) ── */
.optblock{align-self:stretch;animation:fadein .22s ease both;padding-left:0.2rem;transition:opacity .18s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.optblock.leaving{pointer-events:none;}
.optblock.leaving .opt:not(.picked){opacity:.35;transition:opacity .15s ease;}
.opt.picked{border-color:#3fa34d !important;background:#EAF6EC !important;}
.opt.picked .radio{background:#3fa34d;border-color:#3fa34d;box-shadow:inset 0 0 0 3px #EAF6EC;}
.opt.picked .k{background:#3fa34d;color:#fff;}
#chatTail{height:85vh;transition:height .3s ease;}
#chatTail.done{height:6vh;}
.opt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
.opt-hint{font-family:var(--mono);font-size:0.66rem;letter-spacing:0.08em;color:var(--text2);text-transform:uppercase;}
.undo{color:var(--text2);background:none;border:none;font-family:var(--mono);font-size:0.66rem;cursor:pointer;text-decoration:underline;padding:0;}
.undo:hover{color:var(--navy);}
.opts{display:flex;flex-direction:column;gap:0.45rem;}
.opts.grid,.opts.scale,.opts.tiles{flex-direction:row;flex-wrap:wrap;align-items:stretch;}
.opt{background:var(--bg2);border:1.5px solid var(--border2);color:var(--navy);border-radius:13px;
  padding:0.7rem 0.9rem;font-family:var(--body);font-size:0.98rem;text-align:left;cursor:pointer;
  transition:border-color .15s, background .15s, opacity .15s;line-height:1.45;-webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 2px rgba(27,42,74,0.04);display:flex;align-items:center;gap:0.75rem;}
.opt .k{font-family:var(--mono);font-size:0.72rem;color:var(--text2);background:rgba(27,42,74,0.07);
  min-width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s;}
@media(hover:hover){.opt:hover .k{background:var(--green);color:#fff;}}
.opt .lbl{flex:1;}
.opt .radio{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:50%;flex:none;margin-left:auto;transition:border-color .15s,background .15s;}
@media(hover:hover){.opt:hover .radio{border-color:var(--green);}}
.opt:active .radio{background:var(--green);border-color:var(--green);}
.opts.g3 .opt:nth-child(even),.opts.tiles .opt:nth-child(even){background:var(--card);}
.opts.grid:not(.g3) .opt:nth-child(4n+2),.opts.grid:not(.g3) .opt:nth-child(4n+3),
.opts.scale .opt:nth-child(4n+2),.opts.scale .opt:nth-child(4n+3){background:var(--card);}
@media(hover:hover){.opt:hover{border-color:var(--navy);background:var(--bg2);}}
.opt:active{transform:none;}
.opts.grid .opt,.opts.scale .opt{flex:0 0 calc(50% - 0.25rem);text-align:left;padding:0.65rem 0.75rem;font-size:0.92rem;}
.opts.grid.g3 .opt{flex:0 0 calc(33.33% - 0.32rem);}
@media(max-width:560px){.opts.grid .opt{flex:0 0 100%;}.opts.grid.g3 .opt{flex:0 0 calc(50% - 0.25rem);}}
.opts.scale .opt{font-family:var(--mono);font-size:0.84rem;}
.opts.tiles .opt{flex:1 1 calc(33.33% - 0.45rem);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0.3rem;padding:0.75rem 0.4rem;font-size:0.88rem;min-height:64px;}
.opts.tiles .opt .radio{display:none;}
.opts.tiles .opt .lbl{flex:none;line-height:1.3;}
.opts.tiles .opt .k{min-width:20px;height:20px;font-size:0.64rem;}
.opts.tiles.secgrid .opt .k{display:none;}
.opt .ico{width:24px;height:24px;color:var(--navy);opacity:0.8;display:inline-flex;}
.opt .ico svg{width:100%;height:100%;}
.opts.tiles .opt:hover .ico{color:var(--green);opacity:1;}
@media(max-width:560px){.opts.tiles .opt{flex:1 1 calc(50% - 0.45rem);}}
.opt.cta{border-color:#4ade80;background:#4ade80;color:#1A1916;font-weight:700;text-align:center;font-size:1rem;box-shadow:0 8px 22px rgba(74,222,128,0.28);flex:0 0 auto;align-self:flex-start;padding:0.85rem 1.6rem;border-radius:99px;}
.opt.cta:hover{background:#3fd074;transform:none;}
.opt.ghost{color:var(--text2);text-align:center;font-size:0.88rem;background:transparent;box-shadow:none;flex:0 0 auto;align-self:flex-start;padding:0.8rem 1.2rem;border-radius:99px;}
.opts.chiprow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:0.55rem;}

/* ── CARDS ── */
.card{align-self:stretch;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:1.1rem 1.2rem;
  animation:pop .3s ease both;box-shadow:0 1px 3px rgba(27,42,74,0.05);}
.card h3{font-size:0.72rem;font-family:var(--mono);color:var(--text2);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.75rem;}
.card ul{list-style:none;}
.card li{font-size:0.92rem;padding:0.4rem 0;border-bottom:1px dashed var(--border);display:flex;gap:0.5rem;align-items:baseline;line-height:1.55;}
.card li .sig-tag{margin-left:auto;}
.card li:last-child{border-bottom:none;}
.card p{font-size:0.92rem;line-height:1.65;}
.about{display:flex;gap:1rem;align-items:flex-start;}
.about img{width:72px;height:72px;border-radius:8px;object-fit:contain;flex:none;border:1px solid var(--border);}
.about .nm{font-weight:700;font-size:0.98rem;margin-bottom:0.1rem;}
.about .rl{font-family:var(--mono);font-size:0.66rem;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.55rem;}
.about .lnk{display:inline-block;margin-top:0.6rem;font-family:var(--mono);font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);text-decoration:none;border-bottom:1px solid var(--green-soft);}
.about .lnk:hover{border-bottom-color:var(--green);}
@media (max-width:600px){.about img{width:56px;height:56px;}.about{gap:0.8rem;}}
.sig-tag{font-family:var(--mono);font-size:0.62rem;color:var(--green);white-space:nowrap;}
.bar-row{display:grid;grid-template-columns:112px 1fr 46px;gap:0.6rem;align-items:center;margin-bottom:0.65rem;}
.bar-row:last-child{margin-bottom:0;}
.bar-row.lead{background:rgba(45,80,22,0.07);border-radius:10px;padding:0.45rem 0.5rem;margin:0 -0.5rem 0.65rem;}
.bl{font-family:var(--mono);font-size:0.68rem;color:var(--text2);line-height:1.3;}
.bl b{display:block;font-size:0.7rem;}
.bl.cw b{color:#B45309;}.bl.cb b{color:#B91C1C;}.bl.cr b{color:#0F766E;}
.leadchip{display:inline-block;font-size:0.56rem;background:var(--navy);color:#fff;border-radius:5px;padding:0.1rem 0.3rem;margin-top:0.15rem;letter-spacing:0.05em;}
.bt{height:12px;background:rgba(27,42,74,0.08);border-radius:6px;overflow:hidden;}
.bt i{display:block;height:100%;width:0;transition:width .8s ease;border-radius:6px;}
.bt i.cw{background:linear-gradient(90deg,#D97706,#F59E0B);}
.bt i.cb{background:linear-gradient(90deg,#B91C1C,#EF4444);}
.bt i.cr{background:linear-gradient(90deg,#0F766E,#14B8A6);}
.bv{font-family:var(--mono);font-size:0.8rem;font-weight:700;text-align:right;}
.leg{font-size:0.76rem;color:var(--text2);margin-top:0.8rem;border-top:1px dashed var(--border2);padding-top:0.65rem;line-height:1.6;}
.card.warn{border-color:rgba(255,21,37,0.25);}
.card.warn h3{color:var(--red);}
.card.tier{border:1.5px solid var(--green);background:linear-gradient(160deg,#FFFFFF,#F2F6EC);}
.tier .rec{font-family:var(--mono);font-size:0.64rem;color:var(--red);letter-spacing:0.12em;}
.tier .name{font-family:var(--head);font-size:1.35rem;font-weight:700;margin:0.3rem 0 0.35rem;}
.tier .scope{font-size:0.9rem;color:var(--text2);line-height:1.55;}
.tier .price{font-family:var(--mono);font-size:1.6rem;font-weight:700;color:var(--green);margin-top:0.75rem;}
.tier .price small{display:block;font-size:0.62rem;color:var(--text2);font-weight:400;margin-top:0.25rem;letter-spacing:0.08em;}
.tier .recnote{font-size:0.8rem;color:var(--text2);border-top:1px dashed var(--border2);margin-top:0.85rem;padding-top:0.75rem;line-height:1.6;}
.chips{display:flex;flex-wrap:wrap;gap:0.4rem;align-self:flex-start;max-width:92%;}
.chips span{font-family:var(--mono);font-size:0.66rem;background:var(--card);border:1px solid var(--border2);border-radius:99px;padding:0.3rem 0.75rem;color:var(--text2);}

/* ── DİĞER (serbest metin seçeneği) ── */
.opts .opt.other{flex:0 0 100% !important;border-style:dashed;color:var(--text2);}
.opts .opt.other.on{border-style:solid;border-color:var(--green);color:var(--navy);}
.other-box{display:none;flex:0 0 100%;gap:0.5rem;align-items:stretch;}
.other-box.on{display:flex;}
.other-box input{flex:1;min-width:0;background:var(--bg2);border:1.5px solid var(--green);border-radius:12px;padding:0.7rem 0.9rem;color:var(--navy);font-family:var(--body);font-size:0.95rem;outline:none;}
.other-box button{background:#4ade80;color:#1A1916;border:none;border-radius:12px;padding:0 1rem;font-family:var(--body);font-weight:700;font-size:0.92rem;cursor:pointer;flex:none;}
.other-box button:disabled{opacity:0.35;cursor:default;}
.other-box .cnt{position:absolute;right:0;top:-1.1rem;font-family:var(--mono);font-size:0.62rem;color:var(--muted);}
/* ── FORM (inline) ── */
.fform{display:flex;flex-direction:column;gap:0.55rem;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:1rem;}
.fform input[type=text],.fform input[type=email]{background:var(--bg);border:1.5px solid var(--border2);border-radius:12px;
  padding:0.8rem 1rem;color:var(--navy);font-family:var(--body);font-size:0.98rem;width:100%;outline:none;transition:border-color .15s;}
.fform input:focus{border-color:var(--green);}
.fform input.ok{border-color:var(--green);background:#fff;}
.consent{display:flex;gap:0.55rem;align-items:flex-start;font-size:0.76rem;color:var(--text2);line-height:1.55;padding:0.15rem 0.1rem;}
.consent input{margin-top:2px;width:15px;height:15px;flex:none;accent-color:var(--green);}
.consent a{color:var(--green);}
.ferr{display:none;color:var(--red);font-size:0.76rem;margin-top:-0.2rem;padding-left:0.3rem;}
.ferr.on{display:block;}
.fnote{font-size:0.72rem;color:var(--text2);text-align:center;margin-top:0.1rem;}
.nda{border:1px solid var(--border2);border-radius:12px;background:var(--card);overflow:hidden;}
.nda-head{display:flex;align-items:center;gap:0.5rem;padding:0.65rem 0.85rem;cursor:pointer;font-size:0.82rem;color:var(--navy);font-weight:600;user-select:none;}
.nda-head svg{width:15px;height:15px;stroke:var(--green);stroke-width:2;fill:none;flex:none;}
.nda-head .arr{margin-left:auto;color:var(--text2);font-size:0.75rem;transition:transform .2s;}
.nda.open .arr{transform:rotate(180deg);}
.nda-body{display:none;padding:0 0.9rem 0.8rem;font-size:0.78rem;color:var(--text2);line-height:1.6;}
.nda.open .nda-body{display:block;}
.nda-body ol{padding-left:1.1rem;margin-top:0.2rem;}
.nda-body li{margin-bottom:0.2rem;}
.apform{gap:0.5rem;padding:1.2rem 1.1rem;}
.fhead{display:flex;flex-direction:column;gap:0.2rem;padding-bottom:0.75rem;margin-bottom:0.15rem;border-bottom:1px solid var(--border2);}
.fhead b{font-size:1.05rem;color:var(--navy);}
.fhead span{font-size:0.8rem;color:var(--text2);line-height:1.5;}
.fsec{font-family:var(--mono);font-size:0.64rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2);margin-top:0.55rem;}
.flabel{font-size:0.86rem;font-weight:600;color:var(--navy);margin-top:0.2rem;}
.flabel small{font-weight:400;color:var(--text2);font-size:0.74rem;}
.chipset{display:flex;flex-wrap:wrap;gap:0.4rem;}
.fchip{background:var(--bg);border:1.5px solid var(--border2);border-radius:99px;padding:0.5rem 0.9rem;font-family:var(--body);font-size:0.86rem;color:var(--navy);cursor:pointer;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;}
@media(hover:hover){.fchip:hover{border-color:var(--navy);}}
.fchip.on{background:#EAF6EC;border-color:#3fa34d;color:#1f5f2a;font-weight:600;}
.fwarn{display:none;font-size:0.76rem;line-height:1.5;color:#8a5a12;background:#FFF6E5;border:1px solid #F1D9A8;border-radius:10px;padding:0.55rem 0.75rem;}
.fwarn.on{display:block;}
.fform textarea{background:var(--bg);border:1.5px solid var(--border2);border-radius:12px;padding:0.75rem 1rem;color:var(--navy);font-family:var(--body);font-size:0.95rem;width:100%;outline:none;resize:vertical;min-height:3.2rem;line-height:1.45;transition:border-color .15s;}
.fform textarea:focus{border-color:var(--green);}
.sendbtn{background:#4ade80;color:#1A1916;border:none;border-radius:12px;padding:0.9rem;font-family:var(--body);
  font-weight:700;font-size:1rem;cursor:pointer;transition:background .15s;box-shadow:0 6px 18px rgba(74,222,128,0.25);}
.sendbtn:hover{background:#3fd074;}
.sendbtn:disabled{opacity:0.35;cursor:default;}
.hidden{display:none !important;}
@media(max-width:600px){
  .msg{max-width:94%;}
  #chat{padding:1.1rem 0.9rem 4rem;}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="avatar">GX</div>
    <div>
      <div class="hname" id="hName">GembaX Ön Tarama</div>
      <div class="hstat"><span class="dot"></span><span id="hStat">14 soru · ~4 dk · Ücretsiz</span></div>
    </div>
    <div class="hprog">
      <div class="hnum" id="pnum">&nbsp;</div>
      <div class="hbar"><i id="pbar"></i></div>
    </div>
  </div>
</header>

<div id="chat"></div>
<div id="chatTail" aria-hidden="true"></div>

 "eng": {"m": {"code": "m", "pain": "m_pain", "shared": ["m_s1", "m_s2"], "probe": {"w": ["m_i2", "m_q2c"], "b": ["m_b2d", "m_b2a"], "r": ["m_r2", "m_q2b"]}}, "l": {"code": "l", "pain": "l_pain", "shared": ["l_s1", "l_s2"], "probe": {"w": ["l_i2", "l_f1"], "b": ["l_b2c", "l_g1"], "r": ["l_r2", "l_q3"]}}, "d": {"code": "d", "pain": "d_pain", "shared": ["d_s1", "d_s2"], "probe": {"w": ["d_i1", "d_c1"], "b": ["d_b1", "d_b2"], "r": ["d_r2", "d_c2"]}}, "e": {"code": "e", "pain": "e_pain", "shared": ["e_s1", "e_s2"], "probe": {"w": ["e_i2", "e_m1"], "b": ["e_b1", "e_b2"], "r": ["e_r2", "e_q2"]}}, "p": {"code": "p", "pain": "p_pain", "shared": ["p_s1", "p_s2"], "probe": {"w": ["p_i2", "p_q1"], "b": ["p_b1", "p_b2"], "r": ["p_r2", "p_r1"]}}, "h": {"code": "h", "pain": "h_pain", "shared": ["h_s1", "h_s2"], "probe": {"w": ["h_u1", "h_u2"], "b": ["h_b2b", "h_b2c"], "r": ["h_r2", "h_q1"]}}, "c": {"code": "c", "pain": "c_pain", "shared": ["c_s1", "c_s2"], "probe": {"w": ["c_q3", "c_c1"], "b": ["c_b2", "c_b3"], "r": ["c_r2", "c_q2"]}}, "k": {"code": "k", "pain": "k_pain", "shared": ["k_s1", "k_s2"], "probe": {"w": ["k_f1", "k_f2"], "b": ["k_b2", "k_b1"], "r": ["k_r2", "k_p2"]}}, "t": {"code": "t", "pain": "t_pain", "shared": ["t_s1", "t_s2"], "probe": {"w": ["t_i2", "t_c2"], "b": ["t_b3", "t_b2"], "r": ["t_r2", "t_c1"]}}, "s": {"code": "s", "pain": "s_pain", "shared": ["s_s1", "s_s2"], "probe": {"w": ["s_o1", "s_g1"], "b": ["s_d1", "s_b2"], "r": ["s_r2", "s_c1"]}}, "g": {"code": "g", "pain": "g_pain", "shared": ["g_s1", "g_s2"], "probe": {"w": ["g_w1", "g_w2"], "b": ["g_b1", "g_b2"], "r": ["g_r1", "g_r2"]}}, "i": {"code": "i", "pain": "i_pain", "shared": ["i_s1", "i_s2"], "probe": {"w": ["i_u1", "i_c1"], "b": ["i_b2", "i_q2"], "r": ["i_r2", "i_r1"]}}, "f": {"code": "f", "pain": "f_pain", "shared": ["f_s1", "f_s2"], "probe": {"w": ["f_u1", "f_g2"], "b": ["f_p1", "f_b2"], "r": ["f_r1", "f_r2"]}}, "z": {"code": "z", "pain": "z_pain", "shared": ["z_s1", "z_s2"], "probe": {"w": ["z_e1  "read": {"m": {"tr": {"w": "Üretimde israf üç yerde saklanır: rutinleşmiş mesai, \"güvenlik\" adı verilen stok ve kimsenin saymadığı yeniden işleme. Röntgen her birini istasyon bazında dolara çevirir; çoğu zaman en büyük kalem sanılan değil, görünmeyen olur.", "b": "Üretimde darboğaz nadiren en pahalı makinedir; çoğu zaman önünde en uzun kuyruk biriken istasyon ya da bir onay adımıdır. Onu bulmadan alınan her makine, kuyruğu başka yere taşır.", "r": "Aynı arıza, aynı hata, aynı gecikme farklı görünse de üretimde genellikle tek bir köke iner: tanımsız bir standart, ölçülmeyen bir parametre ya da eksik bir devir. Kök bulunmadan her çözüm geçicidir."}, "en": {"w": "In a plant, waste hides in three places: overtime that became routine, inventory called \"safety stock\", and rework nobody counts. The X-ray converts each into dollars by station; the biggest line is usually the one you can't see, not the one you suspect.", "b": "The bottleneck in a plant is rarely the most expensive machine; it's usually the station with the longest queue in front of it, or an approval step. Every machine bought before finding it only moves the queue.", "r": "The same breakdown, defect or delay may look different, but in a plant it usually traces to one root: an undefined standard, an unmeasured parameter or a missing handover. Until the root is found, every fix is temporary."}, "es": {"w": "En planta, el desperdicio se esconde en tres lugares: horas extra convertidas en rutina, inventario llamado \"de seguridad\" y retrabajo que nadie cuenta. La radiografía convierte cada uno en dólares por estación; la mayor partida suele ser la que no se ve, no la que se sospecha.", "b": "El cuello de botella en planta rara vez es la máquina más cara; suele ser la estación con la cola más larga delante, o un paso de aprobación. Cada máquina comprada antes de encontrarlo solo mueve la cola.", "r": "La misma avería, defecto o retraso puede parecer distinto, pero en planta suele llevar a una sola raíz: un estándar no definido, un parámetro no medido o un relevo que falta. Hasta encontrarla, toda solución es temporal."}}, "l": {"tr": {"w": "Depoda israf yarı dolu tırlarda, iki kez dokunulan palette ve yer kaplayan ölü stokta yaşar. Röntgen bunları sipariş başına maliyete çevirir; düşük doluluk tek başına yılda ciddi bir tutara ulaşır.", "b": "Lojistikte darboğaz genellikle rampa değil, rampaya gelene kadar geçilen evrak ve onay adımlarıdır. Kuyruğun nerede biriktiğini bulmadan eklenen her araç ve raf, bekleyen araç sayısını artırır.", "r": "Her hafta tekrarlayan gecikme ve hata farklı vardiyalarda farklı isimlerle görünür; kökü çoğu zaman tek bir tanımsız süreçtir. Kök bulunmadan personel ya da araç değişimi sonucu değiştirmez."}, "en": {"w": "In a warehouse, waste lives in half-empty trucks, pallets touched twice and dead stock taking up space. The X-ray converts these into cost per order; fill rate alone can be worth a truck a year.", "b": "In logistics the bottleneck is usually not the dock but the paperwork and approvals before it. Every truck and rack added before finding the queue only adds waiting trucks.", "r": "The delay and error that recur every week show up under different names in different shifts; the root is usually one undefined process. Changing staff or vehicles won't change the outcome until it's found."}, "es": {"w": "En almacén, el desperdicio vive en camiones medio vacíos, pallets tocados dos veces y stock muerto que ocupa espacio. La radiografía lo convierte en coste por pedido; la ocupación sola puede valer un camión al año.", "b": "En logística el cuello de botella no suele ser el muelle, sino los documentos y aprobaciones previos. Cada camión y estantería añadidos antes de encontrar la cola solo añaden camiones en espera.", "r": "El retraso y el error que se repiten cada semana aparecen con distintos nombres en distintos turnos; la raíz suele ser un único proceso no definido. Cambiar personal o vehículos no cambia el resultado hasta encontrarla."}}, "d": {"tr": {"w": "Distribütörlükte israfın iki büyük adresi: satmayan stok ve geç gelen tahsilat. İkisi de kâr değil nakit yer; röntgen ürün ve müşteri bazında hangisinin ne kadar nakit bağladığını gösterir.", "b": "Dağıtımda darboğaz siparişten sevke geçen günlerde saklanır: çoğu zaman toplama ya da onay-fatura adımı. Bulunmadan büyütülen depo ve filo, bekleyen siparişi bekleyen kamyona çevirir.", "r": "Aynı müşteri sorunu geç teslimat, yanlış ürün ve fatura hatası olarak üç ayrı yerde görünür; genellikle tek bir kökü vardır: tanımsız bir sipariş-onay süreci. Kök bulunmadan müşteri kaybı devam eder."}, "en": {"w": "In distribution, waste has two big addresses: stock that doesn't sell and collections that come late. Both eat cash, not just profit; the X-ray shows which products and customers tie up how much.", "b": "In distribution the bottleneck hides in the days between order and shipment, usually picking or the approval-invoicing step. Warehouse and fleet added before finding it turn waiting orders into waiting trucks.", "r": "The same customer problem appears as late delivery, wrong item and invoice error in three places; it usually has one root: an undefined order-approval process. Customer loss continues until it's found."}, "es": {"w": "En distribución, el desperdicio tiene dos grandes direcciones: el stock que no se vende y el cobro que llega tarde. Ambos se comen la caja, no solo la ganancia; la radiografía muestra qué productos y clientes inmovilizan cuánto.", "b": "En distribución el cuello de botella se esconde en los días entre pedido y despacho, normalmente el picking o el paso de aprobación-facturación. Almacén y flota añadidos antes de encontrarlo convierten pedidos en espera en camiones en espera.", "r": "El mismo problema de cliente aparece como entrega tardía, artículo equivocado y error de factura en tres lugares; suele tener una raíz: un proceso de aprobación de pedidos no definido. La pérdida de clientes sigue hasta encontrarla."}}, "e": {"tr": {"w": "E-ticarette israf iade, yanlış gönderim ve kârsız reklamda yaşar. Sipariş başına kârı bilmeden yapılan her kampanya, ciroyu büyütürken kârı eritebilir; röntgen ürün bazında hangi siparişin para kaybettirdiğini gösterir.", "b": "E-ticarette darboğaz çoğu zaman paketleme masası ya da kargo alım saatidir. Bulunmadan eklenen depo ve personel, aynı saatte aynı kuyruğu üretir.", "r": "Tekrarlayan iade ve şikâyet farklı ürünlerde görünse de kökü genellikle tektir: ürün sayfası, stok kararı ya da yanıt süreci. Kök bulunmadan her kampanya aynı iadeyi yeniden satın alır."}, "en": {"w": "In e-commerce, waste lives in returns, wrong shipments and unprofitable ads. Every campaign run without knowing profit per order can grow revenue while melting profit; the X-ray shows which orders lose money, per product.", "b": "In e-commerce the bottleneck is usually the packing table or the carrier cutoff. Warehouse and staff added before finding it produce the same queue at the same hour.", "r": "Recurring returns and complaints look different across products but usually share one root: the product page, the stock decision or the response process. Until it's found, every campaign buys the same return again."}, "es": {"w": "En e-commerce, el desperdicio vive en devoluciones, envíos equivocados y publicidad sin ganancia. Cada campaña hecha sin conocer la ganancia por pedido puede subir ingresos y derretir la ganancia; la radiografía muestra qué pedidos pierden dinero, por producto.", "b": "En e-commerce el cuello de botella suele ser la mesa de empaque o la hora de recogida del transportista. Almacén y personal añadidos antes de encontrarlo producen la misma cola a la misma hora.", "r": "Las devoluciones y quejas recurrentes parecen distintas entre productos pero suelen compartir una raíz: la ficha de producto, la decisión de stock o el proceso de respuesta. Hasta encontrarla, cada campaña vuelve a comprar la misma devolución."}}, "c": {"tr": {"w": "İnşaatta israf yeniden yapılan işte, fiyatlandırılmayan değişikliklerde ve bekleyen hakedişte birikir. Proje bazında hesaplanmadığında kâr ancak iş bitince görünür; röntgen bunu iş sürerken dolara çevirir.", "b": "Şantiyede darboğaz nadiren ekip sayısıdır; çoğu zaman malzeme onayı ya da taşeron koordinasyonudur. Bulunmadan eklenen ekip, bekleyen ekip sayısını artırır.", "r": "Her projede tekrarlayan sorun farklı şantiyelerde farklı görünür ama kökü tektir: eksik proje bilgisi, sözlü planlama ya da tanımsız değişiklik süreci. Kök bulunmadan sonraki proje de aynı sapmayı yaşar."}, "en": {"w": "In construction, waste accumulates in rework, unpriced changes and waiting progress payments. Without per-project accounting, profit only appears when the job is done; the X-ray converts it into dollars while the job is running.", "b": "On site the bottleneck is rarely crew size; it's usually material approval or subcontractor coordination. Crews added before finding it only add waiting crews.", "r": "The problem that recurs on every project looks different on each site but has one root: missing design information, verbal planning or an undefined change process. The next project repeats the overrun until it's found."}, "es": {"w": "En construcción, el desperdicio se acumula en retrabajo, cambios no valorados y certificaciones en espera. Sin contabilidad por proyecto la ganancia solo aparece al terminar; la radiografía la convierte en dólares con la obra en marcha.", "b": "En obra el cuello de botella rara vez es el número de cuadrillas; suele ser la aprobación de material o la coordinación de subcontratistas. Cuadrillas añadidas antes de encontrarlo solo añaden cuadrillas en espera.", "r": "El problema que se repite en cada proyecto parece distinto en cada obra pero tiene una raíz: información de proyecto incompleta, planificación verbal o un proceso de cambios no definido. El siguiente proyecto repite la desviación hasta encontrarla."}}, "k": {"tr": {"w": "Restoranda israf gıda maliyetinde, fazla hazırlıkta ve tutarsız porsiyonda gizlenir; menü kalemi bazında kârlılık bilinmeden ciro büyür, kâr büyümez. Röntgen kalem bazında hangi tabağın para kaybettirdiğini gösterir.", "b": "Servis darboğazı genellikle mutfak çıkışı ya da oturtma anıdır; personel eklemek kuyruğu değil bekleyen personeli artırır. Önce hangi dakikada neyin tıkandığını bulmak gerekir.", "r": "Yorumlardaki aynı şikâyet farklı vardiyalarda farklı görünür; kökü genellikle tanımsız bir standart ya da eğitim sürecidir. Kök bulunmadan personel değişimi şikâyeti değiştirmez."}, "en": {"w": "In a restaurant, waste hides in food cost, over-prep and inconsistent portions; without per-item profitability, revenue grows and profit doesn't. The X-ray shows which plate loses money.", "b": "The service bottleneck is usually the kitchen pass or the seating moment; adding staff adds waiting staff, not throughput. First find which minute jams what.", "r": "The same complaint in reviews looks different across shifts; its root is usually an undefined standard or training process. Changing staff won't change the complaint until it's found."}, "es": {"w": "En un restaurante, el desperdicio se esconde en el coste de alimentos, el exceso de preparación y las porciones inconsistentes; sin rentabilidad por plato, los ingresos crecen y la ganancia no. La radiografía muestra qué plato pierde dinero.", "b": "El cuello de botella del servicio suele ser la salida de cocina o el momento de sentar; añadir personal añade personal en espera, no capacidad. Primero hay que encontrar qué minuto atasca qué.", "r": "La misma queja en las reseñas parece distinta entre turnos; su raíz suele ser un estándar o un proceso de formación no definido. Cambiar personal no cambia la queja hasta encontrarla."}}, "t": {"tr": {"w": "Klinikte israf son kullanma imhasında, gelmeyen randevuda ve reddedilen faturada birikir. Röntgen bunların her birini yıllık dolara çevirir; çoğu zaman en büyük kalem randevu boşluğudur.", "b": "Klinikte darboğaz hekim değil, hekimden önceki ve sonraki adımlardır: kayıt, tetkik sonucu, çıkış. Bulunmadan eklenen hekim, bekleme odasını büyütür.", "r": "Aynı hasta şikâyeti bekleme, bilgilendirme ve fatura olarak üç yerde görünür; kökü genellikle tek bir tanımsız akıştır. Kök bulunmadan her düzeltme başka bir masaya taşınır."}, "en": {"w": "In a clinic, waste accumulates in expiry write-offs, no-shows and rejected claims. The X-ray converts each into annual dollars; the biggest line is often the empty appointment slot.", "b": "In a clinic the bottleneck is not the physician but the steps before and after: registration, results, discharge. Physicians added before finding it enlarge the waiting room.", "r": "The same patient complaint appears as waiting, information and billing in three places; the root is usually one undefined flow. Every fix moves to another desk until it's found."}, "es": {"w": "En una clínica, el desperdicio se acumula en descartes por caducidad, inasistencias y facturas rechazadas. La radiografía convierte cada uno en dólares anuales; la mayor partida suele ser la cita vacía.", "b": "En una clínica el cuello de botella no es el médico, sino los pasos antes y después: registro, resultados, alta. Médicos añadidos antes de encontrarlo agrandan la sala de espera.", "r": "La misma queja de pacientes aparece como espera, información y facturación en tres lugares; la raíz suele ser un único flujo no definido. Cada corrección pasa a otra mesa hasta encontrarla."}}, "h": {"tr": {"w": "Hizmet işinde israf faturalanmayan saatte ve kapsam dışı yapılan işte yaşar; proje bazında kârlılık bilinmeden hangi müşterinin para kaybettirdiği görülmez. Röntgen saat bazında bunu gösterir.", "b": "Hizmette darboğaz çoğu zaman bir kişi ya da müşteri onayıdır. Bulunmadan alınan eleman, o kişinin ya da onayın önündeki kuyruğu değiştirmez.", "r": "Tekrarlayan revizyon ve şikâyet farklı projelerde farklı görünür; kökü genellikle iş tanımının baştan yanlış kurulmasıdır. Kök bulunmadan her proje aynı revizyon döngüsüne girer."}, "en": {"w": "In a service business, waste lives in unbillable hours and out-of-scope work; without per-project profitability you can't see which client loses money. The X-ray shows it by the hour.", "b": "In services the bottleneck is usually one person or the client's approval. A hire made before finding it doesn't change the queue in front of that person or that approval.", "r": "Recurring revisions and complaints look different across projects; the root is usually a brief set up wrong from the start. Every project enters the same revision loop until it's found."}, "es": {"w": "En un negocio de servicios, el desperdicio vive en horas no facturables y trabajo fuera de alcance; sin rentabilidad por proyecto no se ve qué cliente pierde dinero. La radiografía lo muestra por hora.", "b": "En servicios el cuello de botella suele ser una persona o la aprobación del cliente. Una contratación hecha antes de encontrarlo no cambia la cola delante de esa persona o esa aprobación.", "r": "Las revisiones y quejas recurrentes parecen distintas entre proyectos; la raíz suele ser un brief mal planteado desde el inicio. Cada proyecto entra en el mismo ciclo de revisiones hasta encontrarla."}}, "p": {"tr": {"w": "Perakendede israf tükenen en çok satanda, satmayan stokta ve sayım farkında saklanır. Ürün bazında marj bilinmeden hangi rafın para kaybettirdiği görülmez; röntgen bunu mağaza ve ürün bazında gösterir.", "b": "Mağazada darboğaz yoğun saatteki kasa ve reyondur; saatlik veriyle planlanmayan vardiya, boş saatte fazla, dolu saatte eksik personel üretir. Önce hangi saatte neyin tıkandığını bulmak gerekir.", "r": "Mağazalar arası fark ve her hafta tekrarlayan sorun farklı görünse de kökü genellikle tektir: tanımsız ikmal ya da vardiya süreci. Kök bulunmadan müdür değişimi sonucu değiştirmez."}, "en": {"w": "In retail, waste hides in the best-seller that runs out, stock that doesn't sell and count discrepancies. Without per-product margin you can't see which shelf loses money; the X-ray shows it by store and product.", "b": "In a store the bottleneck is the checkout and the floor at peak; shifts not planned on hourly data produce too many staff off-peak and too few at peak. First find which hour jams what.", "r": "The gap between stores and the weekly recurring problem look different but usually share one root: an undefined replenishment or shift process. Changing managers won't change the outcome until it's found."}, "es": {"w": "En retail, el desperdicio se esconde en el más vendido que se agota, el stock que no se vende y las diferencias de inventario. Sin margen por producto no se ve qué estante pierde dinero; la radiografía lo muestra por tienda y producto.", "b": "En tienda el cuello de botella es la caja y el piso en hora punta; los turnos no planificados con datos por hora producen exceso de personal fuera de punta y falta en punta. Primero hay que encontrar qué hora atasca qué.", "r": "La diferencia entre tiendas y el problema semanal recurrente parecen distintos pero suelen compartir una raíz: un proceso de reposición o de turnos no definido. Cambiar gerentes no cambia el resultado hasta encontrarla."}}, "s": {"tr": {"w": "SaaS'ta israf destek maliyetinde, uzun müşteri kurulumunda ve erken müşteri kaybında yaşar; müşteri başına destek maliyeti bilinmeden hangi segmentin para kaybettirdiği görülmez. Röntgen bunu gösterir.", "b": "Ürün ekibinde darboğaz çoğu zaman test, öncelik kararı ya da tek bir geliştiricidir. Bulunmadan büyütülen ekip, aynı kuyruğa daha çok iş ekler.", "r": "Tekrarlayan olay ve aynı 5 destek konusu farklı müşterilerde farklı görünür; kökü genellikle ardından incelenmeyen tek bir hatadır. Kök bulunmadan her sürüm aynı olayı geri getirir."}, "en": {"w": "In SaaS, waste lives in support cost, long onboarding and early churn; without support cost per customer you can't see which segment loses money. The X-ray shows it.", "b": "In a product team the bottleneck is usually QA, the prioritization decision or a single developer. A team grown before finding it adds more work to the same queue.", "r": "Recurring incidents and the same five support topics look different across customers; the root is usually one bug never given a postmortem. Every release brings the same incident back until it's found."}, "es": {"w": "En SaaS, el desperdicio vive en el coste de soporte, el onboarding largo y el churn temprano; sin coste de soporte por cliente no se ve qué segmento pierde dinero. La radiografía lo muestra.", "b": "En un equipo de producto el cuello de botella suele ser QA, la decisión de prioridad o un solo desarrollador. Un equipo ampliado antes de encontrarlo añade más trabajo a la misma cola.", "r": "Los incidentes recurrentes y los mismos cinco temas de soporte parecen distintos entre clientes; la raíz suele ser un único bug sin postmortem. Cada release trae de vuelta el mismo incidente hasta encontrarla."}}, "i": {"tr": {"w": "Yazılım projelerinde israf faturalanmayan ek talepte, bütçeyi aşan saatte ve teslim sonrası bitmeyen düzeltmede yaşar; proje bazında kârlılık bilinmeden hangi müşterinin para kaybettirdiği görünmez.", "b": "Yazılım projelerinde darboğaz nadiren kod yazımıdır; çoğu zaman netleşmeyen gereksinim, müşteri kabulü ya da her şeyin üzerinden geçtiği tek bir kıdemli geliştiricidir.", "r": "Teslim sonrası hataların çoğu koddan değil, yazılı ve onaylı olmayan gereksinimden doğar. Kök bulunmadan her yeni sürüm aynı düzeltmeyi yeniden gerektirir."}, "en": {"w": "In software projects, waste lives in unbilled change requests, hours beyond budget and post-delivery fixes that never end; without per-project profitability you can't see which client loses you money.", "b": "The bottleneck in software projects is rarely coding; it is usually unclear requirements, client acceptance or one senior developer everything passes through.", "r": "Most post-delivery bugs come not from the code but from requirements that were never written and signed off. Until the root is found, every sprint reproduces the same fix."}, "es": {"w": "En proyectos de software, el desperdicio vive en cambios no facturados, horas por encima del presupuesto y correcciones tras la entrega que nunca terminan; sin rentabilidad por proyecto no se ve qué cliente le hace perder dinero.", "b": "En proyectos de software el cuello de botella rara vez es programar; suele ser un requisito sin aclarar, la aceptación del cliente o un desarrollador sénior por el que pasa todo.", "r": "La mayoría de los errores tras la entrega no nacen del código, sino de requisitos que nunca se escribieron ni se aprobaron. Sin encontrar la raíz, cada sprint reproduce la misma corrección."}}, "f": {"tr": {"w": "Teknik serviste israf saha ekibinin yolda ve beklemede geçen saatinde, tekrar ziyarette ve faturaya yansımayan işçilik ile malzemede yaşar. Röntgen bunları iş emri bazında dolara çevirir.", "b": "Serviste darboğaz çoğu zaman kişi sayısı değildir; parça, iş ataması ya da zor işleri çözebilen tek bir kişidir. Onu bulmadan alınan her eleman kuyruğu yalnızca yer değiştirir.", "r": "Tekrarlayan arıza genellikle cihazdan değil, kaydedilmeyen kök nedenden ya da yanlış ilk teşhisten gelir. İlk seferde çözüm oranı düşükse sorun sahada değil, süreçtedir."}, "en": {"w": "In field service, waste lives in hours spent driving and waiting, in repeat visits and in labor and materials that never reach the invoice. The X-ray converts them into dollars per work order.", "b": "The bottleneck in service is rarely headcount; it is usually parts, job assignment or the one person who can fix the hard jobs. Hiring without finding it just moves the queue.", "r": "Recurring faults usually come not from the equipment but from unrecorded root causes or a wrong first diagnosis. When first-time fix is low, the problem is in the process, not the field."}, "es": {"w": "En el servicio técnico, el desperdicio vive en las horas de ruta y espera, en las visitas repetidas y en la mano de obra y materiales que nunca llegan a la factura. La radiografía los convierte en dólares por orden de trabajo.", "b": "En el servicio el cuello de botella rara vez es la plantilla; suele ser la pieza, la asignación de trabajos o la única persona que resuelve los trabajos difíciles. Contratar sin encontrarlo solo mueve la cola.", "r": "Las averías recurrentes no suelen venir del equipo, sino de causas raíz no registradas o de un primer diagnóstico erróneo. Si la resolución a la primera es baja, el problema está en el proceso, no en el campo."}}, "z": {"tr": {"w": "Tedarik zincirinde israf acil siparişte, ekspres navlunda ve yanlış yerde bekleyen stokta yaşar; toplam tedarik maliyeti bilinmeden en ucuz görünen tedarikçi çoğu zaman en pahalısıdır.", "b": "Tedarik zincirinde darboğaz çoğu zaman tek kaynaklı bir kritik kalem, yavaş bir onay zinciri ya da tutmayan bir tahmindir. Onu bulmadan artırılan stok sorunu çözmez, yalnızca bağlanan nakdi büyütür.", "r": "Her hafta söndürülen tedarik yangını genellikle tek bir köke iner: ortak planın olmaması, yanlış stok kaydı ya da ölçülmeyen tedarikçi performansı. Kök bulunmadan her kriz bir sonrakini hazırlar."}, "en": {"w": "In the supply chain, waste lives in rush orders, express freight and stock sitting in the wrong place; without total supply cost, the cheapest-looking supplier is often the most expensive.", "b": "The supply chain bottleneck is usually a single-source critical item, a slow approval chain or a forecast that misses. Adding stock without finding it doesn't solve the problem; it only ties up more cash.", "r": "The supply fire you fight every week usually traces to one root: no joint plan, wrong stock records or unmeasured supplier performance. Until the root is found, every crisis rehearses the next one."}, "es": {"w": "En la cadena de suministro, el desperdicio vive en los pedidos urgentes, el flete exprés y el stock en el lugar equivocado; sin el coste total de suministro, el proveedor que parece más barato suele ser el más caro.", "b": "En la cadena de suministro el cuello de botella suele ser un artículo crítico de fuente única, una cadena de aprobación lenta o una previsión que falla. Aumentar stock sin encontrarlo no resuelve el problema; solo inmoviliza más caja.", "r": "El incendio de suministro que se apaga cada semana suele tener una sola raíz: no hay plan conjunto, los registros de stock son erróneos o no se mide el desempeño de proveedores. Sin encontrar la raíz, cada crisis ensaya la siguiente."}}, "g": {"tr": {"w": "İsraf gider tablosunda kendi adıyla görünmez; alışılmış maliyetlerin içinde saklanır. Röntgen bunları kalem kalem dolara çevirir.", "b": "İşin hızını en yavaş adım belirler; o adım bulunmadan yapılan yatırım işi hızlandırmaz, bekleyen işi artırır.", "r": "Tekrarlayan sorun, asıl nedeni çözülmemiş sorundur; neden bulunmadan her çözüm geçicidir."}, "en": {"w": "Waste never appears under its own name in the P&L; it appears as routine cost. The X-ray converts it into dollars line by line.", "b": "The slowest link sets the system's speed; investment made before finding the bottleneck grows the queue, not the output.", "r": "A recurring problem is a problem solved at the wrong layer; every fix is temporary until the root is found."}, "es": {"w": "El desperdicio nunca aparece con su nombre en el estado de resultados; aparece como coste rutinario. La radiografía lo convierte en dólares línea por línea.", "b": "El eslabón más lento marca la velocidad del sistema; la inversión hecha antes de encontrar el cuello de botella agranda la cola, no la producción.", "r": "Un problema recurrente es un problema resuelto en la capa equivocada; toda solución es temporal hasta encontrar la raíz."}}, "u": {"tr": {"w": "Eğitimde israf boş kontenjanda, yeniden eğitilen eğitmende ve elle yürütülen kayıt-tahsilat işinde yaşar. Röntgen bunları grup ve dönem bazında dolara çevirir; çoğu zaman en büyük kalem boş sınıf değil, verimsiz idari saattir.", "b": "Eğitimde darboğaz genellikle derslik ya da eğitmen değil, program ve kayıt kararının verildiği noktadır. Onu bulmadan eklenen derslik ve eğitmen doluluğu düşürür.", "r": "Aynı veli şikâyeti, aynı eğitmen ayrılığı ve aynı program kayması farklı dönemlerde farklı adlarla görünür; kökü çoğu zaman tek bir tanımsız süreçtir. Kök bulunmadan her dönem aynı sorun yeniden başlar."}, "en": {"w": "In education, waste lives in unfilled places, in instructors trained and lost, and in enrolment and collections run by hand. The X-Ray converts these to dollars per group and term; the biggest item is often not the empty class but the unproductive admin hour.", "b": "The constraint in education is rarely the room or the instructor; it is usually the point where timetable and enrolment decisions are made. Rooms and instructors added before finding it only lower utilisation.", "r": "The same parent complaint, the same instructor departure and the same timetable slip appear under different names each term; the root is usually one undefined process. Until it is found, every term restarts the same problem."}, "es": {"w": "En educación, el desperdicio vive en las plazas vacías, en los docentes formados y perdidos, y en matrículas y cobros gestionados a mano. La radiografía los convierte en dólares por grupo y periodo; la partida mayor suele ser la hora administrativa improductiva, no el aula vacía.", "b": "La restricción en educación rara vez es el aula o el docente; suele ser el punto donde se deciden horarios y matrículas. Las aulas y docentes añadidos antes de encontrarla solo bajan la ocupación.", "r": "La misma queja de padres, la misma salida de un docente y el mismo cambio de horario aparecen con nombres distintos cada periodo; la raíz suele ser un proceso sin definir. Hasta encontrarla, cada periodo reinicia el mismo problema."}}, "o": {"tr": {"w": "Mobil ve oyunda israf üç yerde saklanır: geri dönüşü ölçülmeyen reklam harcaması, ilk günde kaybedilen kullanıcı ve her sürümde yeniden yapılan iş. Röntgen bunları kohort ve kanal bazında dolara çevirir; çoğu zaman en büyük kalem UA değil, UA'nın satın aldığı ve ilk oturumda kaybedilen kullanıcıdır.", "b": "Mobilde darboğaz nadiren geliştirici sayısıdır; çoğu zaman öncelik kararı, QA ya da tek kişiye bağlı bir adımdır. Bulunmadan büyütülen ekip sürüm süresini kısaltmaz, bekleyen işi artırır.", "r": "Aynı crash, aynı şikâyet ve aynı düşüş her sürümde farklı adlarla görünür; kökü çoğu zaman tek bir eksik süreçtir: test listesi, olay tanımı ya da karar kuralı. Kök bulunmadan her hotfix aynı sorunu bir sonraki sürüme taşır."}, "en": {"w": "In mobile and games, waste hides in three places: ad spend whose return is never measured, users lost on day one, and work redone with every release. The X-Ray converts these to dollars per cohort and channel; the biggest item is often not UA itself but the users UA bought and the first session lost.", "b": "The constraint in mobile is rarely developer headcount; it is usually a prioritisation decision, QA, or a step that depends on one person. A team grown before finding it does not shorten the release cycle; it adds waiting work.", "r": "The same crash, the same complaint and the same drop reappear under different names each release; the root is usually one missing process: a test checklist, an event definition or a decision rule. Until it is found, every hotfix carries the problem into the next build."}, "es": {"w": "En móvil y juegos, el desperdicio se esconde en tres sitios: gasto publicitario cuyo retorno no se mide, usuarios perdidos el primer día y trabajo rehecho en cada versión. La radiografía lo convierte en dólares por cohorte y canal; la partida mayor no suele ser la UA, sino los usuarios comprados y perdidos en la primera sesión.", "b": "La restricción en móvil rara vez es el número de desarrolladores; suele ser una decisión de prioridad, el QA o un paso que depende de una persona. Un equipo ampliado antes de encontrarla no acorta el ciclo de versiones; añade trabajo en espera.", "r": "El mismo crash, la misma queja y la misma caída reaparecen con nombres distintos en cada versión; la raíz suele ser un proceso que falta: una lista de pruebas, una definición de eventos o una regla de decisión. Hasta encontrarla, cada parche traslada el problema a la siguiente versión."}}},

  "c_b2": {"eng":"c","lvl":"D1","t":{"tr":"Ekipler haftada kaç saat bekliyor?","en":"How many hours a week do crews wait?","es":"¿Cuántas horas a la semana esperan las cuadrillas?"},"h":{"tr":"","en":"","es":""},"next":"c_b4","other":0,"opts":[{"l":{"tr":"4 saatten az","en":"Under 4 hours","es":"Menos de 4 horas"},"s":{},"sig":{"tr":"","en":"","es":""},"route":"","dm":0},{"l":{"tr":"4–10 saat","en":"4–10 hours","es":"4–10 horas"},"s":{"b":2},"sig":{"tr":"haftada 4–10 saat bekleme","en":"4–10 hours of waiting per week","es":"4–10 horas de espera semanales"},"route":"","dm":0},{"l":{"tr":"10 saatten fazla","en":"Over 10 hours","es":"Más de 10 horas"},"s":{"b":3},"sig":{"tr":"haftada 10+ saat bekleme","en":"10+ hours of waiting per week","es":"10+ horas de espera semanales"},"route":"","dm":0},{"l":{"tr":"Ölçmüyoruz","en":"We don't measure it","es":"No lo medimos"},"s":{"b":2},"sig":{"tr":"bekleme süresi ölçülmüyor","en":"waiting time not measured","es":"tiempo de espera no medido"},"route":"","dm":1}]},

  setTimeout(function(){ t.remove(); cb(); }, ms);
}
function say(html, opts){
  opts = opts || {};
  typing(opts.delay || 650, function(){
    var n = botMsg(html, opts.small, opts.cls);
    if (opts.then) opts.then(n);
  });
}
function setProgress(step){
  document.getElementById('pnum').textContent = step > 0 ? L.q + ' ' + Math.min(step, totalQ) + '/' + totalQ : '';
  document.getElementById('pbar').style.width = Math.min(100, step / totalQ * 100) + '%';
}

/* ═══════════ INLINE OPTIONS ═══════════ */
var activeBlock = null;
function removeActive(){ if (activeBlock){ activeBlock.remove(); activeBlock = null; } }
function layoutFor(q){
  var n = q.opts.length, lens = 0, num = 0;
  for (var i = 0; i < n; i++){ var l = tx(q.opts[i].l); lens += l.length; if (/\d|%/.test(l)) num++; }
  if (num >= Math.ceil(n/2)) return 'scale';
  if (n >= 9 && lens/n <= 26) return 'tiles';
  return 'grid';
}
function showOpts(q, onPick, anchor, qid){
  removeActive();
  var block = document.createElement('div'); block.className = 'optblock';
  var top = document.createElement('div'); top.className = 'opt-top';
  top.innerHTML = '<span class="opt-hint">' + L.touch + '</span>';
  if (hist.length && !q.raw){
    var u = document.createElement('button'); u.className = 'undo'; u.textContent = L.undo;
    u.onclick = doUndo; top.appendChild(u);
  }
  block.appendChild(top);
  var mode = layoutFor(q);
  var isSector = (qid === 'sector' && mode === 'tiles');
  var box = document.createElement('div'); box.className = 'opts ' + mode + (mode === 'grid' && q.opts.length === 3 ? ' g3' : '') + (isSector ? ' secgrid' : '');
  q.opts.forEach(function(op, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    var ico = isSector ? ICONS[SECTORS[i].icon] : null;
    var lead = ico ? '<span class="ico">' + ico + '</span>' : '<span class="k">' + (i+1) + '</span>';
    b.innerHTML = lead + '<span class="lbl">' + tx(op.l) + '</span><span class="radio"></span>';
    b.onclick = function(){ if (busy) return; busy = true; holdScroll = true; b.classList.add('picked'); block.classList.add('leaving'); setTimeout(function(){ onPick(i); }, 170); };
    box.appendChild(b);
  });
  if (q.other){
    var n = q.opts.length;
    var ob = document.createElement('button'); ob.type = 'button'; ob.className = 'opt other';
    ob.innerHTML = '<span class="k">' + (n+1) + '</span><span class="lbl">' + L.otherLbl + '</span><span class="radio"></span>';
    var row = document.createElement('div'); row.className = 'other-box'; row.style.position = 'relative';
    var inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 80; inp.placeholder = L.otherPh; inp.setAttribute('autocomplete', 'off'); inp.setAttribute('enterkeyhint', 'go');
    var go = document.createElement('button'); go.type = 'button'; go.textContent = L.otherGo; go.disabled = true;
    row.appendChild(inp); row.appendChild(go);
    ob.onclick = function(){ if (busy) return; ob.classList.add('on'); row.classList.add('on'); inp.focus(); };
    inp.addEventListener('input', function(){ go.disabled = inp.value.trim().length < 2; });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !go.disabled){ e.preventDefault(); go.click(); } });
    go.onclick = function(){
      if (busy) return; var txt = inp.value.trim(); if (txt.length < 2) return;
      busy = true; holdScroll = true; ob.classList.add('picked'); block.classList.add('leaving');
      var idx = pickOther(qid, txt);
      setTimeout(function(){ onPick(idx); }, 170);
    };
    box.appendChild(ob); box.appendChild(row);
  }
  block.appendChild(box);
  chat.appendChild(block); activeBlock = block;
  if (anchor) scrollToEl(anchor, 'start', true); else scrollToEl(block, null, true);
}
/* 'Diğer' serbest metni: soruya sanal bir seçenek olarak eklenir (puansız). Alt sektörde sanal alt sektör yaratır: kutunun varsayılan motoru, overlay yok. */
function otherText(t){ var o = {}; o.tr = t; o.en = t; o.es = t; return o; }
function pickOther(qid, txt){
  var q = Q[qid];
  clearOther(qid);
  if (qid === 'sub'){
    var sct = curSector();
    sct.subs.push({ key: sct.key + '_other', eng: sct.eng, label: otherText(txt), short: sct.name, ov: [], other: true, text: txt });
    buildSub();
    return sct.subs.length - 1;
  }
  var last = q.opts[q.opts.length - 1];
  var route = (last && isUnsureOpt(qid, q.opts.length - 1)) ? (last.route || '') : '';
  q.opts.push({ l: otherText(txt), s: {}, sig: {}, route: route || q.next || '', dm: 0, other: true, text: txt });
  return q.opts.length - 1;
}
function clearOther(qid){
  if (qid === 'sub' || qid === 'sector'){ SECTORS.forEach(function(sc){ sc.subs = sc.subs.filter(function(x){ return !x.other; }); }); return; }
  var q = Q[qid]; if (!q) return;
  q.opts = q.opts.filter(function(o){ return !o.other; });
}
function otherAnswers(){
  var out = {};
  var sb = curSub(); if (sb && sb.other) out.sub = sb.text;
  asked.forEach(function(id){ var q = Q[id], a = answers[id]; if (q && q.opts[a] && q.opts[a].other) out[id] = q.opts[a].text; });
  return out;
}
function showChips(list){
  busy = false; removeActive();
  var block = document.createElement('div'); block.className = 'optblock';
  var box = document.createElement('div'); box.className = 'opts chiprow';
  list.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (c.cta ? ' cta' : '') + (c.ghost ? ' ghost' : '');
    b.textContent = c.label;
    b.onclick = function(){ if (busy) return; c.fn(); };
    box.appendChild(b);
  });
  block.appendChild(box);
  chat.appendChild(block); activeBlock = block; scrollToEl(block);
}
function showForm(html){
  removeActive();
  var block = document.createElement('div'); block.className = 'optblock';
  block.innerHTML = html;
  chat.appendChild(block); activeBlock = block; scrollToEl(block, 'start');
  return block;
}

/* ═══════════ FLOW ═══════════ */
var PROFILE = ['sector','sub'];
function curSector(){ return (answers.sector != null) ? SECTORS[answers.sector] : null; }
function curSub(){ var s = curSector(); return (s && answers.sub != null) ? s.subs[answers.sub] : null; }
function resolveSect(){ var sub = curSub(); return (sub && ENG[sub.eng]) || ENG[curSector().eng] || ENG.g; }
function buildSub(){
  var s = curSector();
  Q.sub = { t: s.subQ.t, h: s.subQ.h, other: true, opts: s.subs.map(function(x){ return { l: x.label, s: {}, sig: {} }; }) };
  return Q.sub;
}
function overlayIds(){ var sub = curSub(); return (sub && sub.ov) ? sub.ov.filter(function(id){ return !!Q[id]; }) : []; }
function secName(lg){ lg = lg || lang; var sub = curSub(); var s = curSector(); var o = sub ? sub.short : (s ? s.name : null); return o ? (o[lg] || o.tr || '') : ''; }
function secLabel(){ var sub = curSub(); return sub ? tx(sub.label) : (curSector() ? tx(curSector().name) : ''); }
function subKeyOf(){ var sub = curSub(); return sub ? sub.key : ''; }

function start(){
  say(L.intro1, {delay:500, then:function(){
    say(L.intro2, {delay:800, then:function(){
      say(L.note, {small:true, delay:700, then:function(){
      showChips([{label:L.startBtn, cta:true, fn:function(){
        removeActive(); userMsg(L.startEcho); askNext();
      }}]);
      }});
    }});
  }});
}

function hasScore(s){ return !!(s && ((s.w||0) || (s.b||0) || (s.r||0))); }
function isUnsureOpt(pid, i){
  var op = Q[pid].opts[i]; if (!op || op.other) return false;
  var lastReal = Q[pid].opts.length - 1; while (lastReal > 0 && Q[pid].opts[lastReal].other) lastReal--;
  return i === lastReal && !hasScore(op.s) && !(op.sig && op.sig.tr);
}
function buildPain2(){
  var p = Q[sect.pain], sel = answers[sect.pain];
  var opts = [], map = [];
  p.opts.forEach(function(op, i){
    if (i === sel || op.other) return;
    if (isUnsureOpt(sect.pain, i)) return;
    opts.push({ l: op.l, s: op.s || {}, sig: {}, route: op.route || '' }); map.push(i);
  });
  var none = {}; none[lang] = L.pain2None; none.tr = none.tr || L.pain2None;
  opts.push({ l: none, s: {}, sig: {}, route: '' }); map.push(-1);
  Q.pain2 = { t: {}, h: {}, opts: opts, map: map };
  Q.pain2.t[lang] = L.pain2T; Q.pain2.h[lang] = L.pain2H;
  return Q.pain2;
}
function chainAskedIds(){
  return asked.filter(function(x){ return PROFILE.indexOf(x) < 0 && x !== sect.pain && x !== 'pain2' && x !== 'tried'; });
}
function currentQuestionId(){
  if (answers.sector == null) return 'sector';
  if (answers.sub == null){ buildSub(); return 'sub'; }
  if (!sect) sect = resolveSect();
  if (answers[sect.pain] == null) return sect.pain;
  if (asked.indexOf('pain2') < 0 && !pain2Skipped){
    if (isUnsureOpt(sect.pain, answers[sect.pain])){ pain2Skipped = true; totalQ = CFG.TOTAL - 1; setProgress(asked.length); }
    else { buildPain2(); return 'pain2'; }
  }
  if (chainAskedIds().length >= CFG.CHAIN) return 'tried';
  return chooseNext();
}

/* Skor: ham puan + eksen potansiyeli (sorulan sorularda o eksende alınabilecek en yüksek puan) */
function tally(){
  score = {w:0,b:0,r:0}; pot = {w:0,b:0,r:0}; dmCount = 0; dmIds = [];
  asked.forEach(function(id){
    if (PROFILE.indexOf(id) > -1) return;
    var a = answers[id]; if (a == null) return;
    var q = Q[id]; if (!q || !q.opts[a]) return;
    var f = (id === 'pain2') ? 0.5 : 1;
    var s = q.opts[a].s || {};
    ['w','b','r'].forEach(function(k){
      score[k] += (s[k]||0)*f;
      var mx = 0; q.opts.forEach(function(o){ var v = (o.s && o.s[k]) || 0; if (v > mx) mx = v; });
      pot[k] += mx*f;
    });
    if (q.opts[a].dm){ dmCount++; dmIds.push(id); }
  });
  ['w','b','r'].forEach(function(k){ norm[k] = pot[k] ? score[k]/pot[k] : 0; });
}
function ranked(){ tally(); return ['w','b','r'].sort(function(a,b){ return (norm[b]-norm[a]) || (score[b]-score[a]); }); }
function leader(){ return ranked()[0]; }

/* Dal izleme: kökten (ağrı seçeneği) rotayı takip et; sorulmuş soruya denk gelirse onun cevabından devam et */
function nextOf(qid, a){
  var q = Q[qid]; if (!q) return '';
  var op = (a != null) ? q.opts[a] : null;
  if (op && op.route) return op.route;
  return q.next || '';
}
function branchNext(rootQ, rootA, key, maxDepth){
  var list = branches[key];
  if (list.length >= maxDepth) return null;
  var q = list.length ? list[list.length-1] : rootQ;
  var a = list.length ? answers[q] : rootA;
  var c = nextOf(q, a), guard = 0;
  while (c && asked.indexOf(c) > -1 && guard++ < 8){ c = nextOf(c, answers[c]); }
  if (c && Q[c] && asked.indexOf(c) < 0){ pendingBranch = key; return c; }
  return null;
}
function chooseNext(){
  pendingBranch = null;
  /* 1. birinci ağrının dalı */
  var n = branchNext(sect.pain, answers[sect.pain], 'b1', CFG.D1_DEPTH);
  if (n) return n;
  /* 2. ikinci ağrının dalı */
  if (answers.pain2 != null && Q.pain2 && Q.pain2.map[answers.pain2] >= 0){
    n = branchNext(sect.pain, Q.pain2.map[answers.pain2], 'b2', CFG.D2_DEPTH);
    if (n) return n;
  }
  /* 3. dal kotası dolmadıysa (ikinci ağrı yok ya da dal kısa) yoklama sorusuyla doldur:
        hipotezi yanlışlamak için önce İKİNCİ ekseni, sonra lideri, sonra üçüncüyü yokla */
  var prCount = 0; asked.forEach(function(id){ if (qBranch[id] === 'pr') prCount++; });
  if (branches.b1.length + branches.b2.length + prCount < CFG.D1_DEPTH + CFG.D2_DEPTH){ n = probeNext(); if (n) return n; }
  /* 4. alt sektöre özgü sorular */
  var ov = overlayIds();
  for (var i = 0; i < ov.length; i++) if (asked.indexOf(ov[i]) < 0){ pendingBranch = 'ov'; return ov[i]; }
  /* 5. ortak sorular (yatırım sonucu, suçlama döngüsü) en sonda */
  for (var j = 0; j < sect.shared.length; j++) if (asked.indexOf(sect.shared[j]) < 0 && Q[sect.shared[j]]){ pendingBranch = 'sh'; return sect.shared[j]; }
  /* 6. hâlâ boş slot varsa yoklama */
  n = probeNext(); if (n) return n;
  return 'tried';
}
function probeNext(){
  var R = ranked(), order = [R[1], R[0], R[2]], cand = [];
  order.forEach(function(k){ (sect.probe[k] || []).forEach(function(x){ cand.push(x); }); });
  Object.keys(Q).forEach(function(id){ var q = Q[id]; if (q.eng === sect.code && /^D[123]$/.test(q.lvl || '')) cand.push(id); });
  for (var c = 0; c < cand.length; c++) if (asked.indexOf(cand[c]) < 0 && Q[cand[c]]){ pendingBranch = 'pr'; return cand[c]; }
  return null;
}

function askNext(){
  busy = true; removeActive();
  var id = currentQuestionId();
  var qDef = Q[id];
  var tT = qT(id), tH = qH(id);
  var title = tT + (tH ? '<span class="hint">' + tH + '</span>' : '');
  var withAck = asked.length > 0 && asked.length % 2 === 1;
  holdScroll = asked.length > 0;
  var br = pendingBranch; pendingBranch = null;
  var ask = function(){
    say(title, {delay: 430, cls:'q', then: function(node){
      holdScroll = false;
      if (curQ) curQ.classList.remove('active');
      node.classList.add('active');
      curQ = node;
      busy = false;
      setProgress(asked.length + 1);
      var record = {id: id, nodes: [node]};
      showOpts(qDef, function(i){
        answers[id] = i;
        removeActive();
        var um = userMsg(qO(id, i));
        record.nodes.push(um);
        hist.push(record);
        asked.push(id);
        if (br){ qBranch[id] = br; if (branches[br]) branches[br].push(id); }
        if (id === 'tried'){ finish(); }
        else { askNext(); }
      }, node, id);
    }});
  };
  if (withAck){
    setTimeout(function(){
      var ackNode = botMsg(L.acks[ackIdx++ % L.acks.length], true);
      if (hist.length) hist[hist.length-1].nodes.push(ackNode);
      ask();
    }, 160);
  } else ask();
}

function dropFromBranches(id){
  ['b1','b2'].forEach(function(k){ var i = branches[k].indexOf(id); if (i > -1) branches[k].splice(i, 1); });
  delete qBranch[id];
}
function doUndo(){
  if (busy || !hist.length) return;
  removeActive();
  var rec = hist.pop();
  rec.nodes.forEach(function(n){ if (n === curQ) curQ = null; n.remove(); });
  var i = asked.lastIndexOf(rec.id);
  if (i > -1) asked.splice(i, 1);
  delete answers[rec.id];
  clearOther(rec.id);
  dropFromBranches(rec.id);
  if (rec.id === 'pain2' || (sect && rec.id === sect.pain)){ pain2Skipped = false; totalQ = CFG.TOTAL; }
  if (rec.id === 'sector' || rec.id === 'sub'){
    sect = null; pain2Skipped = false; totalQ = CFG.TOTAL;
    Object.keys(answers).forEach(function(k){ if (PROFILE.indexOf(k) < 0) delete answers[k]; });
    asked = asked.filter(function(x){ return PROFILE.indexOf(x) > -1; });
    branches = { b1: [], b2: [] }; qBranch = {};
    if (rec.id === 'sector'){ delete answers.sub; asked = asked.filter(function(x){ return x !== 'sub'; }); }
  }
  setProgress(asked.length);
  askNext();
}

/* ═══════════ RESULT ═══════════ */
function cap(s){ return s.charAt(0).toLocaleUpperCase('tr') + s.slice(1); }
/* Saf değerlendirme: DOM'a dokunmaz; simülasyon ve testler de bunu çağırır */
function evaluate(){
  tally();
  var signals = [];
  asked.forEach(function(id){
    if (PROFILE.indexOf(id) > -1) return;
    if (id === sect.pain || id === 'pain2') return;
    var q = Q[id], a = answers[id]; if (a == null || !q.opts[a]) return;
    var s = q.opts[a].s || {}, sig = qS(id, a), sigTR = qSTR(id, a);
    var wt = (s.w||0)+(s.b||0)+(s.r||0);
    var tag = (s.w||0) >= (s.b||0) && (s.w||0) >= (s.r||0) ? 'w' : (s.b||0) >= (s.r||0) ? 'b' : 'r';
    if (sig) signals.push({t:sig, tr:sigTR, wt:wt, tag:tag, id:id});
  });
  signals.sort(function(a,b){ return b.wt-a.wt; });
  var seen = {}, top = [], topT = [], topTR = [];
  signals.forEach(function(s){ if (!seen[s.t] && top.length < 4){ seen[s.t]=1; top.push(s.t); topT.push(s.tag); topTR.push(s.tr); } });
  var R = ranked();
  var prim = R[0], sec = R[1];
  var secStrong = norm[sec] >= 0.7*norm[prim] && score[sec] >= 4;
  function strong(k){ return score[k] >= 6 && norm[k] >= 0.5; }
  var code;
  if (strong('w') && strong('b') && strong('r')) code = 'transformation';
  else if (prim === 'r' || (sec === 'r' && secStrong)) code = 'full';
  else if (prim === 'b' || (prim === 'w' && sec === 'b' && secStrong)) code = 'xray-toc';
  else code = 'xray';
  var tot = Math.max(0.0001, norm.w + norm.b + norm.r);
  var pct = {}; ['w','b','r'].forEach(function(k){ pct[k] = Math.round(norm[k]/tot*100); });
  return { prim:prim, sec:sec, secStrong:secStrong, code:code, top:top, topT:topT, topTR:topTR, pct:pct, dm:dmCount };
}
function finish(){
  busy = true; holdScroll = false; removeActive(); setProgress(totalQ);
  if (curQ){ curQ.classList.remove('active'); curQ = null; }
  document.getElementById('pnum').textContent = L.done;
  var EV = evaluate();
  var prim = EV.prim, sec = EV.sec, secStrong = EV.secStrong, code = EV.code, top = EV.top, topT = EV.topT, topTR = EV.topTR;
  var tier = TIERS[code];
  var sname = secName();
  function pct(k){ return EV.pct[k]; }
  var RD = (READ[sect.code] && READ[sect.code][lang]) || (READ[sect.code] && READ[sect.code].tr) || READ.g[lang] || READ.g.tr;

  say(L.evalMsg, {delay:600, then:function(){
    typing(1100, function(){
      var sl = el('sysline', sname + ' · ' + U.rLabel);
      scrollToEl(sl, 'start', true);
      setTimeout(function(){ var ct = document.getElementById('chatTail'); if (ct) ct.classList.add('done'); }, 900);
      noScroll = true;

      var CK = {w:'cw', b:'cb', r:'cr'};
      var bars = ['w','b','r'].map(function(k){
        var lead = k === prim;
        return '<div class="bar-row' + (lead?' lead':'') + '"><span class="bl ' + CK[k] + '"><b>' + TAGS[k] + '</b>' + (lead?'<span class="leadchip">' + L.lead + '</span>':'') + '</span><span class="bt"><i class="' + CK[k] + '" data-w="' + pct(k) + '"></i></span><span class="bv">' + pct(k) + '%</span></div>';
      }).join('');
      var leg = '<p class="leg"><b style="color:#B45309">' + TAGS.w + '</b>: ' + L.legw + ' · <b style="color:#B91C1C">' + TAGS.b + '</b>: ' + L.legb + ' · <b style="color:#0F766E">' + TAGS.r + '</b>: ' + L.legr + '</p>';
      el('card', '<h3>' + DV.scoreH + '</h3>' + bars + leg);
      setTimeout(function(){ document.querySelectorAll('.bt i').forEach(function(i){ i.style.width = i.dataset.w + '%'; }); }, 80);

      var triedTxt = Q.tried.opts[answers.tried] != null ? qO('tried', answers.tried) : '';
      el('chips', '<span>' + secLabel() + '</span>' + (triedTxt ? '<span>' + triedTxt + '</span>' : ''));

      setTimeout(function(){
        var head = lang === 'tr' ? ('<strong>' + NAMES[prim] + '</strong>' + U.startWith + (secStrong ? ' ' + NAMES[sec] + U.alsoStrong : '')) : ('<strong>' + NAMES[prim] + '</strong>' + U.startWith + (secStrong ? ' ' + U.alsoStrong + ' ' + NAMES[sec] + '.' : ''));
        botMsg(head + '<span class="hint">' + WHY[prim] + '</span>');

        if (top.length){
          el('card', '<h3>' + U.sigH + '</h3><ul>' + top.map(function(t,i){ return '<li>' + cap(t) + '<span class="sig-tag">' + TAGS[topT[i]] + '</span></li>'; }).join('') + '</ul>');
        }
        if (dmCount >= CFG.DM_NOTE){
          el('card warn', '<h3>' + L.dmH + '</h3><p>' + L.dmP.replace('%N%', dmCount) + '</p>');
        }
        el('card warn', '<h3>' + U.dontH + '</h3><p>' + DONT[prim] + '</p>');
        el('card', '<h3>' + DV.readH + '</h3><p>' + RD[prim] + '</p>');

        el('card tier', '<div class="rec">' + U.recTag + '</div><div class="name">' + tier[0] + '</div><div class="scope">' + tier[1] + '</div><div class="price">' + tier[2] + '<small>' + tier[3] + '</small></div><div class="recnote">' + L.recNote + '</div>');

        el('card', '<h3>' + DV.delivH + '</h3><ul>' + DV[code].map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul>');

        el('card', '<h3>' + L.gxH + '</h3><p>' + L.gxP + '</p>');

        savePacket(code, tier, top, topTR);

        setTimeout(function(){
          say(L.ctaAsk, {delay:700, then:function(){
            showChips([
              {label:L.applyChip, cta:true, fn:function(){ noScroll = false; removeActive(); userMsg(L.applyEcho); showApplyForm(code); }},
              {label:L.mailChip, ghost:true, fn:function(){ noScroll = false; removeActive(); userMsg(L.mailChipEcho); showEmailForm(); }}
            ]);
            var ab = el('card', '<h3>' + L.aboutH + '</h3><div class="about"><img src="' + ABOUT_IMG + '" alt="Dr. Murat Uzunlu" width="72" height="72" loading="lazy" draggable="false"><div><div class="nm">Dr. Murat Uzunlu</div><div class="rl">' + L.aboutRole + '</div><p>' + L.aboutP + '</p><a class="lnk" lang="en" href="https://www.linkedin.com/in/muratuzunlu/" target="_blank" rel="noopener nofollow">LinkedIn ↗</a></div></div>');
            try { ab.setAttribute('data-nosnippet', ''); } catch(e){}
          }});
        }, 500);
      }, 900);

function savePacket(code, tier, top, topTR){
  var ansTR = {}; asked.forEach(function(id){ var a = answers[id]; if (a == null) return; if (id === 'sector') ansTR[id] = tx(SECTORS[a].name); else if (id === 'sub') ansTR[id] = (curSub().label.tr || ''); else if (Q[id] && Q[id].opts[a]) ansTR[id] = (Q[id].opts[a].l.tr || qO(id, a)); });
  var packet = { v:4, source:'chat-prescan', lang:lang, sector:answers.sector, sub:(answers.sub != null ? answers.sub : null), sub_key:subKeyOf(), sector_tr:secName('tr'),
    sc:sect.code, tier:code, price:tier[2], score:score, norm:norm, dm:dmCount, dm_ids:dmIds, branches:branches, other:otherAnswers(),
    signals:top.slice(0,3), signals_tr:(topTR||top).slice(0,3), answers:answers, answers_tr:ansTR, asked:asked, ts:new Date().toISOString() };
  try { localStorage.setItem('gembax-prescan', JSON.stringify(packet)); } catch(e){}
  return packet;
}
function submit(payload, cb){
  if (!CFG.WEBHOOK){ console.warn('GEMBAX SUBMIT: webhook tanımsız, gönderim YAPILMADI', payload); setTimeout(function(){ cb(false); }, 400); return; }
  var done = false, t = setTimeout(function(){ if (!done){ done = true; cb(false); } }, 15000);
  var ap = payload.apply || {}, eo = payload.emailOnly || {};
  var trT = (UI.tr.tiers || {})[payload.tier] || [payload.tier || '-', '', payload.price || ''];
  var paket = trT[0] + ' (' + (trT[2] || payload.price || '') + ')';
  var ref = payload.ref || ('GBX-' + Date.now().toString().slice(-8)); payload.ref = ref;
  var sc = payload.score || {};
  var body = {
    _subject: '[GembaX] ' + (payload.apply ? trT[0] + ' başvurusu: ' + (ap.company || '-') : 'Ön tarama, sadece e-posta: ' + (eo.email || '-')),
    basvuran: ap.name || '',
    email: ap.email || eo.email || '',
    sirket: ap.company || '',
    web: ap.web || '',
    rol: ap.role || '',
    calisan: ap.employees || '',
    ciro: ap.revenue || '',
    sorun_ozeti: ap.note || '',
    intake2_link: payload.apply ? ('https://gembax.ai/detay?token=TOKEN' + ['name','company','email','title','sector','problem'].map(function(k){
      var v = {name:ap.name, company:ap.company, email:ap.email, title:ap.role, sector:payload.sc, problem:ap.note}[k] || '';
      return '&' + k + '=' + encodeURIComponent(v); }).join('')) : '',
    paket: paket,
    tur: payload.apply ? 'basvuru' : 'sadece-eposta',
    ref: ref,
    lang: (payload.lang || 'tr').toUpperCase(),
    submitted_at: new Date().toISOString(),
    sektor: (payload.sector_tr || '-') + ' [' + (payload.sc || '') + (payload.sub_key ? ' · ' + payload.sub_key : '') + ']',
    skor: 'israf ' + (sc.w||0) + ' / darbogaz ' + (sc.b||0) + ' / kok neden ' + (sc.r||0) + (payload.dm != null ? ' / bilinmeyen ' + payload.dm : ''),
    cevaplar_tr: payload.answers_tr || {},
    diger_metin: payload.other || {},
    sinyaller: (payload.signals_tr || payload.signals || []).join(' | '),
    consent_meta: { consentDate: new Date().toISOString(), nda: !!payload.apply, lang: payload.lang || 'tr' },
    tum_cevaplar: payload.answers || {},
    paket_json: JSON.stringify(payload)
  };
  /* İki kanala paralel gönder; biri başarılıysa yeterli */
  var urls = [CFG.WEBHOOK]; if (CFG.WEBHOOK2) urls.push(CFG.WEBHOOK2);
  var pending = urls.length;
  function fin(ok){
    if (done) return;
    if (ok){ done = true; clearTimeout(t); cb(true); return; }
    if (--pending <= 0){ done = true; clearTimeout(t); cb(false); }
  }
  var body2 = {}; Object.keys(body).forEach(function(k){ var v = body[k]; body2[k] = (v && typeof v === 'object') ? JSON.stringify(v) : v; });
  body2._template = 'table'; body2._replyto = body.email;
  urls.forEach(function(u, i){
    fetch(u, {method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, body:JSON.stringify(i === 0 ? body : body2)})
      .then(function(r){ fin(!!(r && r.ok)); })
      .catch(function(){ fin(false); });
  });
}
function sendFail(sb, label){
  sb.disabled = false; sb.textContent = label;
  var box = sb.parentNode.querySelector('.ferr.send');
  if (!box){ box = document.createElement('div'); box.className = 'ferr send on'; box.style.textAlign = 'center'; sb.parentNode.insertBefore(box, sb.nextSibling); }
  box.innerHTML = L.sendErr; box.classList.add('on');
}
