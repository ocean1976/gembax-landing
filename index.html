<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GembaX — X-Ray of Operational Waste</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FAF9F6;
    --bg-secondary: #FFFFFF;
    --bg-card: #F4F2EE;
    --text-primary: #1B2A4A;
    --text-secondary: #4A5568;
    --text-muted: #8fa093;
    --accent: #2D5016;
    --accent-dark: #1e3f0f;
    --accent-light: #3d6b22;
    --accent-glow: rgba(45, 80, 22, 0.08);
    --accent-glow-strong: rgba(45, 80, 22, 0.15);
    --border: rgba(0,0,0,0.08);
    --border-accent: rgba(45, 80, 22, 0.25);
    --dot-color: rgba(45, 80, 22, 0.18);
    --font-body: 'Instrument Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-editorial: 'Playfair Display', Georgia, serif;

    /* Maroon (Aşama 2) */
    --maroon: #6E1414;
    --maroon-glow: rgba(110, 20, 20, 0.04);
    --border-maroon: rgba(110, 20, 20, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background-color: var(--bg-primary);
    background-image: 
      linear-gradient(rgba(45,80,22,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,80,22,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text-primary); line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* Scroll progress bar */
  .scroll-progress {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 3px; background: transparent;
  }
  .scroll-progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(45,80,22,0.4);
  }

  /* Section blueprint divider */
  .blueprint-divider {
    display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0 auto; max-width: 1200px;
  }
  .blueprint-divider::before,
  .blueprint-divider::after {
    content: ''; flex: 1; height: 1px;
    background: repeating-linear-gradient(90deg,
      var(--accent) 0px, var(--accent) 8px, transparent 8px, transparent 14px
    );
    opacity: 0.18;
  }
  .blueprint-divider-mark {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
    opacity: 0.25; flex-shrink: 0; margin: 0 0.8rem;
    border: 1px solid rgba(45,80,22,0.15); border-radius: 50%;
  }

  /* Card ref label */
  .card-ref {
    position: absolute; top: 0.8rem; right: 0.8rem;
    font-family: var(--font-mono); font-size: 0.58rem;
    color: var(--text-muted); opacity: 0.5;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* Doc metadata strip */
  .doc-metadata {
    display: flex; align-items: center; justify-content: center;
    gap: 1.5rem; padding: 0.7rem 2rem;
    font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase; opacity: 0.45;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .doc-metadata span { white-space: nowrap; }
  .doc-metadata .meta-sep { opacity: 0.3; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem; padding-bottom: 1.8rem;
    display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(20px);
    background: rgba(240,238,232,0.92);
    border-bottom: none;
    transition: all 0.3s ease;
  }
  nav::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 14px;
    background:
      repeating-linear-gradient(90deg,
        var(--accent) 0px, var(--accent) 0.5px, transparent 0.5px, transparent 10px
      ),
      repeating-linear-gradient(90deg,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 50px
      );
    background-size: 10px 5px, 50px 13px;
    background-position: 0 bottom, 0 bottom;
    background-repeat: repeat-x;
    opacity: 0.20;
    pointer-events: none;
  }
  .logo { display: flex; flex-direction: column; font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text-primary); text-decoration: none; line-height: 1; }
  .logo-main { display: inline; }
  .logo-x { color: var(--accent); }
  .logo-sub { font-size: 0.6rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 0.2rem; }
  .hamburger {
    display: none; background: none; border: none; cursor: pointer;
    flex-direction: column; gap: 5px; padding: 0.4rem;
  }
  .hamburger span {
    display: block; width: 22px; height: 2px;
    background: var(--text-primary); border-radius: 2px;
    transition: all 0.3s;
  }
  .nav-links { display: flex; gap: 1.2rem; align-items: center; }
  .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.88rem; font-weight: 400; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-cta { background: var(--accent) !important; color: #fff !important; padding: 0.55rem 1.4rem; border-radius: 6px; font-weight: 600 !important; font-size: 0.85rem !important; }
  .nav-cta:hover { background: var(--accent-dark) !important; }

  /* Language Dropdown */
  .lang-dropdown { position: relative; }
  .lang-toggle {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.35rem 0.7rem;
    font-size: 0.8rem; font-weight: 600; color: var(--text-primary);
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .lang-toggle:hover { border-color: var(--border-accent); }
  .lang-toggle svg { width: 12px; height: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .lang-dropdown.open .lang-toggle svg { transform: rotate(180deg); }
  .lang-menu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    min-width: 100px; overflow: hidden; z-index: 200;
  }
  .lang-dropdown.open .lang-menu { display: block; }
  .lang-menu a {
    display: block !important; padding: 0.55rem 1rem !important;
    font-size: 0.82rem !important; font-weight: 500 !important;
    color: var(--text-secondary) !important; transition: all 0.15s;
  }
  .lang-menu a:hover { background: var(--accent-glow) !important; color: var(--accent-dark) !important; }
  .lang-menu a.active { color: var(--accent) !important; font-weight: 600 !important; }

  /* HERO */
  .hero {
    min-height: 100vh; display: grid;
    grid-template-columns: 1fr 1.1fr; /* Resmi büyütmek için ızgarayı ayarladım */
    align-items: center; gap: 3rem;
    padding: 7rem 3rem 3rem; max-width: 1300px; margin: 0 auto;
  }
  .hero-text { padding-right: 1rem; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent-glow); border: 1px solid var(--border-accent);
    border-radius: 100px; padding: 0.4rem 1rem;
    font-size: 0.8rem; color: var(--accent-dark); font-weight: 500;
    margin-bottom: 1.2rem; width: fit-content;
    animation: fadeUp 0.8s ease both;
  }
  .hero-badge::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .hero h1 {
    font-size: clamp(1.9rem, 3.2vw, 2.8rem); font-weight: 700;
    line-height: 1.15; letter-spacing: -0.02em;
    margin-bottom: 1rem; animation: fadeUp 0.8s 0.1s ease both;
  }
  .hero h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
  .hero-motto {
    font-size: 1.15rem; color: var(--text-muted);
    max-width: 580px; line-height: 1.6; margin-bottom: 0.75rem;
    animation: fadeUp 0.8s 0.15s ease both;
  }
  .hero-motto em { color: var(--accent); font-style: italic; font-weight: 500; }
  .hero-motto strong { font-weight: 700; color: var(--text-primary); }
  .hero-sub { font-size: 1.05rem; color: var(--text-secondary); max-width: 520px; line-height: 1.65; margin-bottom: 1rem; animation: fadeUp 0.8s 0.2s ease both; }
  .hero-bullets {
    list-style: none; max-width: 520px; margin-bottom: 2rem;
    animation: fadeUp 0.8s 0.25s ease both;
  }
  .hero-bullets li {
    position: relative; padding-left: 1.4rem;
    font-size: 1.02rem; color: var(--text-secondary);
    line-height: 1.6; margin-bottom: 0.4rem;
  }
  .hero-bullets li::before {
    content: '→'; position: absolute; left: 0;
    color: var(--accent); font-weight: 600;
  }
  .hero-actions { display: flex; gap: 1rem; animation: fadeUp 0.8s 0.3s ease both; }

  /* Hero X-ray image with Scan effect */
  .hero-xray {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.18),
      0 0 0 1px rgba(0,0,0,0.08);
    animation: fadeUp 0.8s 0.4s ease both;
    background: #0a0f0a;
  }
  .hero-xray img {
    width: 100%; height: auto;
    object-fit: contain;
    display: block;
    transition: all 0.6s ease;
    max-height: 80vh; /* Masaüstünde çok uzamasını engellemek için */
  }
  .hero-xray:hover img {
    transform: scale(1.015);
    filter: brightness(1.05);
  }
  
  /* X-ray scan line effect (İnce sarı lazer tarama çizgisi) */
  .xray-scan-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 1.5px; /* Jilet gibi ince çizgi */
    background: rgba(241, 196, 15, 0.6); /* Şık endüstriyel sarı lazer */
    box-shadow: 0 0 8px 1px rgba(241, 196, 15, 0.4);
    opacity: 0.35; /* Görseli boğmayan, çok az belli olan asil parlama */
    pointer-events: none;
    animation: xrayScan 4s linear infinite alternate; /* Orta hızda yukarı-aşağı */
    z-index: 2;
  }
  
  @keyframes xrayScan {
    0% { top: 0%; }
    100% { top: 100%; }
  }

  .hero-xray::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 18px;
    border: 1.5px solid rgba(45, 107, 69, 0.15);
    pointer-events: none;
    transition: border-color 0.4s;
    z-index: 3;
  }
  .hero-xray:hover::after {
    border-color: rgba(45, 107, 69, 0.35);
    box-shadow: 0 0 40px rgba(45, 107, 69, 0.08);
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent); color: #fff;
    padding: 0.85rem 2rem; border-radius: 8px;
    font-weight: 600; font-size: 0.95rem; text-decoration: none;
    transition: all 0.25s; border: none; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow-strong); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--bg-secondary); color: var(--text-primary);
    padding: 0.85rem 2rem; border-radius: 8px;
    font-weight: 500; font-size: 0.95rem; text-decoration: none;
    border: 1px solid var(--border); transition: all 0.25s;
  }
  .btn-secondary:hover { border-color: var(--text-muted); }

  /* STATS */
  .stats-strip {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 4rem 3rem; background: var(--bg-secondary);
    background-image: 
      linear-gradient(rgba(45,80,22,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,80,22,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .stats-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; }
  .stats-inner .stat-item .stat-number { font-family: var(--font-mono); font-size: clamp(2.5rem, 5vw, 3.5rem); font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 0.5rem; }
  .stats-inner .stat-item .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; font-weight: 500; }
  .stats-inner .stat-item .stat-desc { font-size: 1.05rem; color: var(--text-secondary); line-height: 1.6; }

  /* SECTIONS */
  section { padding: 6rem 3rem; max-width: 1200px; margin: 0 auto; }
  .section-label { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 400; font-style: italic; }
  .section-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -0.025em; margin-bottom: 1.5rem; }
  .section-title em { font-style: italic; font-weight: 300; color: var(--accent); }
  .section-desc { color: var(--text-secondary); font-size: 1.15rem; max-width: 620px; line-height: 1.7; margin-bottom: 3rem; }

  /* GEMBA */
  .gemba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
  .gemba-text { padding-right: 2rem; }
  .gemba-visual { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; position: relative; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
  .gemba-visual::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 40%, var(--accent-glow) 0%, transparent 60%); pointer-events: none; }
  .gemba-equation { position: relative; z-index: 1; }
  .eq-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  .eq-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.5rem; flex: 1; }
  .eq-box-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.3rem; }
  .eq-box-value { font-size: 1.15rem; font-weight: 600; }
  .eq-box-value span { color: var(--accent); }
  .eq-plus { font-family: var(--font-mono); color: var(--text-muted); font-size: 1.5rem; font-weight: 700; flex-shrink: 0; }
  .eq-result { background: var(--accent-glow); border: 1px solid var(--border-accent); border-radius: 12px; padding: 1.2rem 1.5rem; text-align: center; }
  .eq-result-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--accent-dark); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.3rem; }
  .eq-result-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
  .eq-output-box { margin-top: 1.5rem; padding: 1.2rem; background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); }
  .eq-output-box .eq-box-label { margin-bottom: 0.5rem; }
  .eq-output-text { font-size: 0.98rem; color: var(--text-secondary); line-height: 1.6; }
  .eq-output-text strong { color: var(--accent); font-weight: 700; font-family: var(--font-mono); }

  /* PROCESS */
  .process-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
  .process-card { position: relative; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; transition: all 0.3s ease; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
  .process-card:hover { border-color: var(--border-accent); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
  .process-num { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 1rem; font-weight: 700; }
  .process-card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
  .process-card p { color: var(--text-secondary); font-size: 1rem; line-height: 1.65; }
  .process-card .process-output { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); font-weight: 500; }

  /* ROOT CAUSE PREVIEW SECTION */
  #root-cause-preview {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4.5rem 3rem;
  }
  .rc-container {
    max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.7fr; gap: 3.5rem; align-items: center;
  }
  .rc-visual-wrapper {
    background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; box-shadow: inset 0 0 20px rgba(0,0,0,0.02); overflow-x: auto;
  }
  .pull-quote { border-left: 3px solid var(--maroon); padding: 0.8rem 0 0.8rem 1.2rem; margin: 1.5rem 0; }
  .pull-quote p { font-family: var(--font-editorial); font-size: 1.15rem; font-style: italic; line-height: 1.5; color: var(--text-primary); }
  .pull-quote cite { display: block; margin-top: 0.4rem; font-family: var(--font-mono); font-size: 0.65rem; font-style: normal; color: var(--text-muted); text-transform: uppercase; }

  /* WASTE */
  .waste-section { padding: 6rem 3rem; max-width: 1200px; margin: 0 auto; }
  .waste-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .waste-cell { background: var(--bg-secondary); padding: 1.8rem; transition: all 0.3s; }
  .waste-cell:hover { background: var(--bg-card); }
  .waste-icon-svg { width: 32px; height: 32px; margin-bottom: 0.75rem; display: block; color: var(--accent); }
  .waste-name { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.35rem; }
  .waste-eng { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .waste-example { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.55; }
  .waste-cost { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); font-weight: 700; margin-top: 0.6rem; letter-spacing: 0.02em; }

  /* SECTORSHatan harika! Bu cerrahi dokunuşlar GembaX kervanının hızlanması için şarttı.

Tüm bağlantıları ve dil senkronizasyon altyapısını pürüzsüzce kurguladım:

1.  **Welcome Bağlantısı:** Navbar'daki, Hero bölümündeki ve Alt CTA'daki tüm **"Start Analysis"** butonlarını `/intake-welcome.html` sayfasına rota (`href`) olarak cerrahi bir titizlikle bağladım.
2.  **Dil persistence (Kalıcılık):** `index.html`'den ES (Español) seçilirse, tarayıcı artık bunu hafızasına alıyor. Welcome sayfasına da bir cerrahi Javascript dokunuşu ekledim. Bu kod, sayfa açılır açılmaz ana sayfadaki ES seçimini kontrol ediyor ve Welcome sayfasını otomatik olarak İspanyolca açıyor. (Elbette EN ve TR için de geçerli).
3.  **Fiyat Düzeltmesi:** Welcome sayfasındaki ön soruşturma ücretini cerrahi bir müdahale ile **$150** olarak güncelledim.

Sarı ince lazer tarama efektini ve gizlilik odaklı unvan yapınızı eksiksiz koruyan **tek parça eksiksiz `index.html` kodunuz:**

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GembaX — X-Ray of Operational Waste</title>
<link href="[https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap](https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap)" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FAF9F6;
    --bg-secondary: #FFFFFF;
    --bg-card: #F4F2EE;
    --text-primary: #1B2A4A;
    --text-secondary: #4A5568;
    --text-muted: #8fa093;
    --accent: #2D5016;
    --accent-dark: #1e3f0f;
    --accent-light: #3d6b22;
    --accent-glow: rgba(45, 80, 22, 0.08);
    --accent-glow-strong: rgba(45, 80, 22, 0.15);
    --border: rgba(0,0,0,0.08);
    --border-accent: rgba(45, 80, 22, 0.25);
    --dot-color: rgba(45, 80, 22, 0.18);
    --font-body: 'Instrument Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-editorial: 'Playfair Display', Georgia, serif;

    /* Maroon (Aşama 2) */
    --maroon: #6E1414;
    --maroon-glow: rgba(110, 20, 20, 0.04);
    --border-maroon: rgba(110, 20, 20, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background-color: var(--bg-primary);
    background-image: 
      linear-gradient(rgba(45,80,22,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,80,22,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text-primary); line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* Scroll progress bar */
  .scroll-progress {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 3px; background: transparent;
  }
  .scroll-progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(45,80,22,0.4);
  }

  /* Section blueprint divider */
  .blueprint-divider {
    display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0 auto; max-width: 1200px;
  }
  .blueprint-divider::before,
  .blueprint-divider::after {
    content: ''; flex: 1; height: 1px;
    background: repeating-linear-gradient(90deg,
      var(--accent) 0px, var(--accent) 8px, transparent 8px, transparent 14px
    );
    opacity: 0.18;
  }
  .blueprint-divider-mark {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
    opacity: 0.25; flex-shrink: 0; margin: 0 0.8rem;
    border: 1px solid rgba(45,80,22,0.15); border-radius: 50%;
  }

  /* Card ref label */
  .card-ref {
    position: absolute; top: 0.8rem; right: 0.8rem;
    font-family: var(--font-mono); font-size: 0.58rem;
    color: var(--text-muted); opacity: 0.5;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* Doc metadata strip */
  .doc-metadata {
    display: flex; align-items: center; justify-content: center;
    gap: 1.5rem; padding: 0.7rem 2rem;
    font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase; opacity: 0.45;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .doc-metadata span { white-space: nowrap; }
  .doc-metadata .meta-sep { opacity: 0.3; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem; padding-bottom: 1.8rem;
    display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(20px);
    background: rgba(240,238,232,0.92);
    border-bottom: none;
    transition: all 0.3s ease;
  }
  nav::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 14px;
    background:
      repeating-linear-gradient(90deg,
        var(--accent) 0px, var(--accent) 0.5px, transparent 0.5px, transparent 10px
      ),
      repeating-linear-gradient(90deg,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 50px
      );
    background-size: 10px 5px, 50px 13px;
    background-position: 0 bottom, 0 bottom;
    background-repeat: repeat-x;
    opacity: 0.20;
    pointer-events: none;
  }
  .logo { display: flex; flex-direction: column; font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text-primary); text-decoration: none; line-height: 1; }
  .logo-main { display: inline; }
  .logo-x { color: var(--accent); }
  .logo-sub { font-size: 0.6rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 0.2rem; }
  .hamburger {
    display: none; background: none; border: none; cursor: pointer;
    flex-direction: column; gap: 5px; padding: 0.4rem;
  }
  .hamburger span {
    display: block; width: 22px; height: 2px;
    background: var(--text-primary); border-radius: 2px;
    transition: all 0.3s;
  }
  .nav-links { display: flex; gap: 1.2rem; align-items: center; }
  .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.88rem; font-weight: 400; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-cta { background: var(--accent) !important; color: #fff !important; padding: 0.55rem 1.4rem; border-radius: 6px; font-weight: 600 !important; font-size: 0.85rem !important; }
  .nav-cta:hover { background: var(--accent-dark) !important; }

  /* Language Dropdown */
  .lang-dropdown { position: relative; }
  .lang-toggle {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.35rem 0.7rem;
    font-size: 0.8rem; font-weight: 600; color: var(--text-primary);
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .lang-toggle:hover { border-color: var(--border-accent); }
  .lang-toggle svg { width: 12px; height: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .lang-dropdown.open .lang-toggle svg { transform: rotate(180deg); }
  .lang-menu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    min-width: 100px; overflow: hidden; z-index: 200;
  }
  .lang-dropdown.open .lang-menu { display: block; }
  .lang-menu a {
    display: block !important; padding: 0.55rem 1rem !important;
    font-size: 0.82rem !important; font-weight: 500 !important;
    color: var(--text-secondary) !important; transition: all 0.15s;
  }
  .lang-menu a:hover { background: var(--accent-glow) !important; color: var(--accent-dark) !important; }
  .lang-menu a.active { color: var(--accent) !important; font-weight: 600 !important; }

  /* HERO */
  .hero {
    min-height: 100vh; display: grid;
    grid-template-columns: 1fr 1.1fr; /* Resmi büyütmek için ızgarayı ayarladım */
    align-items: center; gap: 3rem;
    padding: 7rem 3rem 3rem; max-width: 1300px; margin: 0 auto;
  }
  .hero-text { padding-right: 1rem; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent-glow); border: 1px solid var(--border-accent);
    border-radius: 100px; padding: 0.4rem 1rem;
    font-size: 0.8rem; color: var(--accent-dark); font-weight: 500;
    margin-bottom: 1.2rem; width: fit-content;
    animation: fadeUp 0.8s ease both;
  }
  .hero-badge::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .hero h1 {
    font-size: clamp(1.9rem, 3.2vw, 2.8rem); font-weight: 700;
    line-height: 1.15; letter-spacing: -0.02em;
    margin-bottom: 1rem; animation: fadeUp 0.8s 0.1s ease both;
  }
  .hero h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
  .hero-motto {
    font-size: 1.15rem; color: var(--text-muted);
    max-width: 580px; line-height: 1.6; margin-bottom: 0.75rem;
    animation: fadeUp 0.8s 0.15s ease both;
  }
  .hero-motto em { color: var(--accent); font-style: italic; font-weight: 500; }
  .hero-motto strong { font-weight: 700; color: var(--text-primary); }
  .hero-sub { font-size: 1.05rem; color: var(--text-secondary); max-width: 520px; line-height: 1.65; margin-bottom: 1rem; animation: fadeUp 0.8s 0.2s ease both; }
  .hero-bullets {
    list-style: none; max-width: 520px; margin-bottom: 2rem;
    animation: fadeUp 0.8s 0.25s ease both;
  }
  .hero-bullets li {
    position: relative; padding-left: 1.4rem;
    font-size: 1.02rem; color: var(--text-secondary);
    line-height: 1.6; margin-bottom: 0.4rem;
  }
  .hero-bullets li::before {
    content: '→'; position: absolute; left: 0;
    color: var(--accent); font-weight: 600;
  }
  .hero-actions { display: flex; gap: 1rem; animation: fadeUp 0.8s 0.3s ease both; }

  /* Hero X-ray image with Scan effect */
  .hero-xray {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.18),
      0 0 0 1px rgba(0,0,0,0.08);
    animation: fadeUp 0.8s 0.4s ease both;
    background: #0a0f0a;
  }
  .hero-xray img {
    width: 100%; height: auto;
    object-fit: contain;
    display: block;
    transition: all 0.6s ease;
    max-height: 80vh; /* Masaüstünde çok uzamasını engellemek için */
  }
  .hero-xray:hover img {
    transform: scale(1.015);
    filter: brightness(1.05);
  }
  
  /* X-ray scan line effect (İnce sarı lazer tarama çizgisi) */
  .xray-scan-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 1.5px; /* Jilet gibi ince çizgi */
    background: rgba(241, 196, 15, 0.6); /* Şık endüstriyel sarı lazer */
    box-shadow: 0 0 8px 1px rgba(241, 196, 15, 0.4);
    opacity: 0.35; /* Görseli boğmayan, çok az belli olan asil parlama */
    pointer-events: none;
    animation: xrayScan 4s linear infinite alternate; /* Orta hızda yukarı-aşağı */
    z-index: 2;
  }
  
  @keyframes xrayScan {
    0% { top: 0%; }
    100% { top: 100%; }
  }

  .hero-xray::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 18px;
    border: 1.5px solid rgba(45, 107, 69, 0.15);
    pointer-events: none;
    transition: border-color 0.4s;
    z-index: 3;
  }
  .hero-xray:hover::after {
    border-color: rgba(45, 107, 69, 0.35);
    box-shadow: 0 0 40px rgba(45, 107, 69, 0.08);
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent); color: #fff;
    padding: 0.85rem 2rem; border-radius: 8px;
    font-weight: 600; font-size: 0.95rem; text-decoration: none;
    transition: all 0.25s; border: none; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow-strong); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--bg-secondary); color: var(--text-primary);
    padding: 0.85rem 2rem; border-radius: 8px;
    font-weight: 500; font-size: 0.95rem; text-decoration: none;
    border: 1px solid var(--border); transition: all 0.25s;
  }
  .btn-secondary:hover { border-color: var(--text-muted); }
